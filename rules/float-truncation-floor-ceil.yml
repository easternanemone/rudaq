id: float-truncation-floor-ceil
language: rust
severity: warning
message: "Float .floor()/.ceil() cast to integer - verify this is intentional, not a missing .round()."
note: "Per CLAUDE.md: Use .round() when converting to integers for scientific accuracy."
url: https://doc.rust-lang.org/std/primitive.f64.html#method.round
rule:
  kind: type_cast_expression
  all:
    - has:
        field: type
        regex: "^(i8|i16|i32|i64|i128|isize|u8|u16|u32|u64|u128|usize)$"
    - has:
        field: value
        kind: call_expression
        has:
          kind: field_expression
          has:
            field: field
            regex: "^(floor|ceil)$"
          stopBy: end
        stopBy: end
  not:
    any:
      - inside:
          kind: function_item
          follows:
            kind: attribute_item
            regex: "test"
          stopBy: end
      - inside:
          kind: mod_item
          follows:
            kind: attribute_item
            regex: "cfg.*test"
          stopBy: end
