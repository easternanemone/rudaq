id: dbg-macro
language: rust
severity: error
message: "dbg!() writes to stderr and should not be in production code. Use tracing macros instead."
note: "dbg!() is for local debugging only. Use tracing::debug!() for structured logging."
url: https://doc.rust-lang.org/std/macro.dbg.html
rule:
  pattern: dbg!($$$)
  not:
    any:
      - inside:
          kind: function_item
          follows:
            kind: attribute_item
            regex: "test"
          stopBy: end
      - inside:
          kind: mod_item
          follows:
            kind: attribute_item
            regex: "cfg.*test"
          stopBy: end
