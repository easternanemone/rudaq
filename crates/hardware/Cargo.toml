[package]
name = "hardware"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true
serde_json.workspace = true
regex = "1.0.8"
minijinja = { version = "2.10", features = ["loader"] }
futures.workspace = true
log = "0.4.21"
serde_yaml = "0.9"
dirs = "5.0"
rand = "0.8.5"
toml.workspace = true
dashmap = "6.1"
serde_valid = "0.24"
schemars = "0.8"
evalexpr = "11"
figment = { version = "0.10", features = ["toml"] }
crc = { version = "3.4.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync", "time", "macros", "fs", "io-util"] }
tokio-util = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["sync", "time", "macros", "io-util"] }

# Serial: use common::serial (serial2-tokio) - no direct tokio-serial/serialport

# pvcam-sys = { path = "../rust-daq/pvcam-sys", optional = true } # Removed

[dependencies.driver-pvcam]
path = "../driver-pvcam"
optional = true

[dependencies.driver-comedi]
path = "../driver-comedi"
optional = true

[dependencies.driver-universal]
path = "../driver-universal"

[dependencies.driver-mock]
path = "../driver-mock"

[dependencies.driver-thorlabs]
path = "../driver-thorlabs"
optional = true

[dependencies.driver-newport]
path = "../driver-newport"
optional = true

[dependencies.driver-spectra-physics]
path = "../driver-spectra-physics"
optional = true

[dependencies.driver-red-pitaya]
path = "../driver-red-pitaya"
optional = true

[dependencies.driver-andor-sdk3]
path = "../driver-andor-sdk3"
optional = true

[dev-dependencies]
tempfile.workspace = true

[dependencies.notify]
version = "6.1"
optional = true

[dependencies.hot-lib-reloader]
version = "0.8"
optional = true

[features]
# Simplified feature flags (bd-0aqw)
default = ["serial"]

# Serial communication (async via common::serial / serial2-tokio)
serial = ["common/serial"]

# Hardware drivers (all require serial)
thorlabs = ["serial", "dep:driver-thorlabs"]           # ELL14 rotators
thorlabs_config = ["thorlabs"]  # Config-based ELL14 driver
newport = ["serial", "dep:driver-newport"]            # Newport stages
spectra_physics = ["serial", "dep:driver-spectra-physics"]    # Spectra-Physics lasers
newport_power_meter = ["newport"] # Newport 1830-C power meter (included in newport)
red_pitaya = ["dep:driver-red-pitaya"]      # Red Pitaya PID controller

# PVCAM camera support
pvcam = ["dep:driver-pvcam"]                           # Mock driver (fast compile)
pvcam_sdk = ["pvcam", "driver-pvcam/pvcam_sdk"]        # Real SDK (requires installation)
pvcam_hardware = ["pvcam_sdk"]                             # Back-compat alias for pvcam_sdk

# Comedi DAQ support (Linux only)
comedi = ["dep:driver-comedi"]                         # Mock driver (fast compile)
comedi_hardware = ["comedi", "driver-comedi/hardware"] # Real hardware (requires comedilib)

# Andor iStar camera and Shamrock spectrograph (SDK3)
andor = ["dep:driver-andor-sdk3"]
andor_hardware = ["andor", "driver-andor-sdk3/hardware"]

# Convenience feature: all hardware drivers (with mock PVCAM and Comedi)
all_hardware = ["thorlabs", "newport", "spectra_physics", "newport_power_meter", "pvcam", "comedi", "red_pitaya", "andor"]

# Full feature set
full = ["all_hardware", "simulator"]

# Other features
simulator = []
plugins_hot_reload = ["dep:notify", "dep:hot-lib-reloader"]
binary_protocol = ["dep:crc"]   # Modbus RTU, etc.

[lints]
workspace = true
