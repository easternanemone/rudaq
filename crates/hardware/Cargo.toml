[package]
name = "hardware"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true
serde_json.workspace = true
regex = "1.0.8"
minijinja = { version = "2.10", features = ["loader"] }
futures.workspace = true
log = "0.4.21"
serde_yaml = "0.9"
dirs = "5.0"
rand = "0.8.5"
toml.workspace = true
dashmap = "6.1"
serde_valid = "0.24"
schemars = "0.8"
evalexpr = "11"
figment = { version = "0.10", features = ["toml"] }
crc = { version = "3.4.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync", "time", "macros", "fs", "io-util"] }
tokio-util = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["sync", "time", "macros", "io-util"] }

# Mock drivers (always compiled, used for testing)
[dependencies.driver-mock]
path = "../driver-mock"

[dev-dependencies]
tempfile.workspace = true

[dependencies.notify]
version = "6.1"
optional = true

[dependencies.hot-lib-reloader]
version = "0.8"
optional = true

[features]
# After bd-ga7k.10 (dependency inversion), hardware is traits + registry only.
# Concrete driver features have moved to the driver-registry crate.
default = ["serial"]

# Serial communication (async via common::serial / serial2-tokio)
serial = ["common/serial"]

# Test utilities: mock drivers, mock registry helpers (M-TEST-UTIL, bd-qd4zn)
test-util = []

# Other features
simulator = []
plugins_hot_reload = ["dep:notify", "dep:hot-lib-reloader"]
binary_protocol = ["dep:crc"]   # Modbus RTU, etc.

[lints]
workspace = true
