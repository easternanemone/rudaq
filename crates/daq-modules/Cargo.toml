[package]
name = "daq-modules"
version = "0.1.0"
edition = "2021"
description = "Experiment modules and plugin system for rust-daq"

[dependencies]
common = { path = "../common" }
hardware = { path = "../hardware" }
anyhow.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { version = "1.10", features = ["v4", "serde"] }
scripting = { path = "../scripting", optional = true }
plugin-api = { path = "../plugin-api", optional = true }

[dev-dependencies]
tempfile.workspace = true


[features]
scripting = ["dep:scripting"]
native_plugins = ["dep:plugin-api"]
scripting_python = ["scripting/python"]

[lints]
workspace = true
