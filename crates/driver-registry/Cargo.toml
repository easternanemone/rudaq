[package]
name = "driver-registry"
version = "0.1.0"
edition = "2024"
description = "Concrete driver factory registration for rust-daq. Owns feature gating for all hardware drivers."
license = "MIT"

[dependencies]
# Foundation: hardware provides DeviceRegistry, HardwareConfig, and abstract APIs
hardware = { path = "../hardware", default-features = false, features = ["test-util"] }
common = { path = "../common" }
tracing.workspace = true
anyhow.workspace = true
toml.workspace = true

# Mock drivers (always available)
driver-mock = { path = "../driver-mock" }

# Config-driven universal driver (always available for TOML manifest loading)
driver-universal = { path = "../driver-universal" }

# Runtime SDK probing (lightweight — attempts dlopen without linking)
libloading = { version = "0.8", optional = true }

# Concrete hardware drivers (all optional, gated by features)
driver-pvcam = { path = "../driver-pvcam", optional = true }
driver-comedi = { path = "../driver-comedi", optional = true }
driver-andor-sdk3 = { path = "../driver-andor-sdk3", optional = true }

[features]
default = ["serial", "runtime_probe"]

# Serial communication (pass-through to hardware)
serial = ["hardware/serial"]

# Test utilities: canonical mock registry helpers (M-TEST-UTIL, bd-qd4zn)
test-util = ["hardware/test-util"]

# Runtime SDK probing via dlopen (detects SDK availability without linking)
runtime_probe = ["dep:libloading"]

# PVCAM camera support
pvcam = ["dep:driver-pvcam"]
pvcam_sdk = ["pvcam", "driver-pvcam/pvcam_sdk"]
pvcam_hardware = ["pvcam_sdk"]

# Comedi DAQ support (Linux only)
comedi = ["dep:driver-comedi"]
comedi_hardware = ["comedi", "driver-comedi/hardware"]

# Andor iStar camera and Shamrock spectrograph (SDK3)
andor = ["dep:driver-andor-sdk3"]
andor_hardware = ["andor", "driver-andor-sdk3/hardware"]

# Convenience: all hardware drivers (with mock PVCAM and Comedi)
all_hardware = ["pvcam", "comedi", "andor"]

# Full feature set
full = ["all_hardware"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
