[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tonic = { workspace = true, features = ["tls", "gzip"] }
prost.workspace = true
async-trait.workspace = true
futures.workspace = true
tracing.workspace = true
log = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
figment = { version = "0.10", features = ["toml", "env"] }
http = "1.1"
http-body = "1.0"
http-body-util = "0.1"
jsonwebtoken = "9.3"
dirs = "4.0"
anyhow.workspace = true

# NOTE (bd-5bfv): Use default-features = false to prevent cascading defaults.
# After bd-ga7k.10 (dependency inversion), hardware no longer has driver features.
common = { path = "../common" }
echelle = { path = "../echelle" }
hardware = { path = "../hardware", default-features = false, features = ["test-util"] }
storage = { path = "../storage" }
scripting = { path = "../scripting", optional = true }
daq-modules = { path = "../daq-modules", optional = true, default-features = false }
protocol = { path = "../protocol" }

# Comedi driver used directly by ni_daq_service (not via hardware re-export)
driver-comedi = { path = "../driver-comedi", optional = true }

# Serial: hardware/serial uses common/serial (serial2-tokio) - no direct tokio-serial
hdf5 = { package = "hdf5-metno", version = "0.12.4", optional = true }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sha2 = "0.10"
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"], optional = true }
tonic-web = { version = "0.12", optional = true }
sysinfo = "0.37.2"
bincode = "1.3"
rerun = { version = "0.27.3", features = ["server"], optional = true }
experiment = { version = "0.1.0", path = "../experiment" }
db = { path = "../db", optional = true }
reqwest = { workspace = true, optional = true }
dashmap = "6.1"

# Metrics and monitoring (bd-v299)
prometheus = { version = "0.14", optional = true }
hyper = { version = "1.6", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }

[features]
# Simplified feature flags (bd-0aqw)
default = ["modules", "server", "scripting", "alerting"]

# ============================================================================
# CRATE-SPECIFIC (activate optional deps or gate code within server itself)
# ============================================================================
server = ["dep:tonic-web", "dep:tower-http", "dep:tower-layer", "dep:tower-service"]  # gRPC web transport layer
alerting = ["dep:reqwest"]             # Webhook alerting (Slack/Discord)
scripting = ["dep:scripting"]          # Rhai/Python scripting engine
modules = ["dep:daq-modules"]          # DAQ module system
modules_scripting = ["modules", "daq-modules/scripting"]
comedi = ["dep:driver-comedi"]         # NI DAQ — used directly by ni_daq_service
comedi_hardware = ["comedi", "driver-comedi/hardware"]
rerun_sink = ["dep:rerun"]             # Rerun visualization sink
metrics = ["dep:prometheus", "dep:hyper", "dep:hyper-util", "storage/metrics"]  # Prometheus + metrics forwarding

# ============================================================================
# PASS-THROUGH (forwarded to downstream crates, no cfg usage in server itself)
# ============================================================================
# Database persistence (ConfigService gRPC handler)
db = ["dep:db"]
# Storage backends
storage_hdf5 = ["dep:hdf5", "storage/storage_hdf5"]
storage_arrow = ["storage/storage_arrow"]
# Serial communication
serial = ["hardware/serial"]

[dev-dependencies]
config = "0.14.1"
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["hdf5"]  # Feature-gated optional deps
