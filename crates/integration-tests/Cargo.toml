[package]
name = "integration-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
common = { path = "../common" }
echelle = { path = "../echelle" }
hardware = { path = "../hardware", features = ["test-util"] }
driver-registry = { path = "../driver-registry", features = ["all_hardware"] }
experiment = { path = "../experiment" }
daq-modules = { path = "../daq-modules", features = ["scripting"], optional = true }
driver-mock = { path = "../driver-mock" }
storage = { path = "../storage" }
protocol = { path = "../protocol" }
server = { path = "../server", optional = true }
scripting = { path = "../scripting", optional = true }
ui = { path = "../ui" }
anyhow.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing.workspace = true
serde_json.workspace = true
uuid = { version = "1.10", features = ["v4", "serde"] }
futures.workspace = true
async-trait.workspace = true
tempfile.workspace = true
chrono.workspace = true
tonic = { workspace = true, features = ["transport"] }
tokio-stream = { version = "0.1", features = ["sync"] }
hdf5 = { package = "hdf5-metno", version = "0.12.4", optional = true }
arrow = { version = "57", features = ["ipc"] }
nix = { version = "0.29", features = ["term"] }
driver-pvcam = { path = "../driver-pvcam", optional = true }
driver-universal = { path = "../driver-universal", features = ["emulator"], optional = true }
db = { path = "../db", optional = true }
toml.workspace = true

[dev-dependencies]
serial_test = "3.1.1"
tokio-test = "0.4"
tracing-test = "0.2"
tracing-subscriber = { version = "0.3", features = ["registry"] }


[features]
default = ["server", "scripting", "storage_hdf5", "storage_arrow", "serial", "modules", "pvcam", "universal", "db"]

# ============================================================================
# CRATE-LOCAL ONLY (no downstream forwarding, gate test code only)
# ============================================================================
hardware_tests = []      # Gates real-hardware test paths (pvcam, elliptec, etc.)
libs_drivers = []        # Nextest group marker (no cfg usage)
libs_spirit_driver = []  # Nextest group marker (no cfg usage)

# ============================================================================
# HYBRID (activate optional deps + forward to downstream + gate test files)
#
# In integration-tests, most features serve triple duty:
#   1. Activate an optional dependency (dep:server, dep:scripting, etc.)
#   2. Forward feature flags to downstream crates (storage/storage_hdf5, etc.)
#   3. Gate #[cfg(feature = "...")] in test files to skip tests when disabled
# ============================================================================
server = ["dep:server"]                   # gRPC tests (grpc_server_test, grpc_roundtrip, grpc_config_service_e2e)
scripting = ["dep:scripting"]             # e2e_script_execution, grpc tests with scripting
universal = ["dep:driver-universal"]      # hardware_universal_driver_validation tests
gui_egui = ["ui/standalone"]              # gui_logic_test, gui_visual_test, gui_camera_test
storage_hdf5 = ["dep:hdf5", "storage/storage_hdf5", "server/storage_hdf5"]  # data_pipeline/hdf5_tests, full_pipeline
storage_arrow = ["storage/storage_arrow", "server/storage_arrow", "common/storage_arrow"]  # data_pipeline, full_pipeline
pvcam = ["dep:driver-pvcam", "driver-registry/pvcam"]   # pvcam_integration, end_to_end_frames, grpc_camera_test
pvcam_sdk = ["pvcam", "driver-registry/pvcam_sdk"]       # pvcam_streaming_test, module_exports
serial = ["hardware/serial"]              # plugin_system_integration
modules = ["daq-modules"]                 # module_exports_test
db = ["dep:db", "dep:server", "server/db"]           # DB e2e tests, andor tests, runtime_metadata
# Legacy aliases (deprecated)
db-surreal-mem = ["db"]
db-surreal-rocksdb = ["db"]

[[bench]]
name = "lock_contention"
harness = false

[[bench]]
name = "ring_buffer_latency"
harness = false

[lints]
workspace = true
