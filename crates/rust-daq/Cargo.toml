

# Keep the main crate at root for compatibility
[package]
name = "rust_daq"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "A modular scientific data acquisition (DAQ) application in Rust."


[lib]
crate-type = ["cdylib", "rlib"]
name = "rust_daq"
path = "src/lib.rs"

# Inherit workspace lints (crate-specific overrides moved to workspace Cargo.toml)
[lints]
workspace = true


[dependencies]
# Async Runtime
# tokio replaced below with correct features

common = { path = "../common" }
protocol = { path = "../protocol" }
hardware = { path = "../hardware", default-features = false }
storage = { path = "../storage", default-features = false }
server = { path = "../server", optional = true }
scripting = { path = "../scripting", optional = true }
experiment = { path = "../experiment" }
plugin-api = { path = "../plugin-api", optional = true }

# Standalone driver crates
driver-mock = { path = "../driver-mock", optional = true }
driver-thorlabs = { path = "../driver-thorlabs", optional = true }
driver-newport = { path = "../driver-newport", optional = true }
driver-spectra-physics = { path = "../driver-spectra-physics", optional = true }
driver-comedi = { path = "../driver-comedi", optional = true }
driver-generic = { path = "../driver-generic", optional = true }

# Memory Allocator (Microsoft Rust Guidelines: M-MIMALLOC-APPS)
# mimalloc removed (moved to daq-bin)

# GUI (updated to latest to fix macOS crash)
# GUI (updated to latest to fix macOS crash)
# GUI (updated to latest to fix macOS crash)
egui = { version = "0.30", optional = true }
eframe = { version = "0.30", features = ["persistence"], optional = true }
egui_plot = { version = "0.30", optional = true }
egui_extras = { version = "0.30", optional = true }
hdf5 = { package = "hdf5-metno", version = "0.11.0", optional = true }
arrow = { version = "57", optional = true, features = ["ipc"] }
csv = { version = "1.3.0", optional = true }
matrw = { version = "0.1.2", optional = true }
# netcdf = { version = "0.9.0", optional = true }
chrono = { workspace = true, features = ["serde"] }

# Serialization & Configuration
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
config = { version = "0.14.0", features = ["toml"] }
toml.workspace = true
# V5 configuration system (Figment-based)
figment = { version = "0.10", features = ["toml", "env"] }

# Error Handling
anyhow.workspace = true
thiserror.workspace = true

# Scripting

# Logging
log = "0.4.21"
tracing.workspace = true

# CLI
# clap removed (moved to daq-bin)

# Concurrency & Async
async-trait.workspace = true
futures.workspace = true

# gRPC & Protobuf (for remote control API)
# tonic = { version = "0.10", default-features = false, features = ["prost", "codegen"] }
# prost = "0.12"
tokio-stream = { version = "0.1", default-features = false, features = ["sync", "net"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
similar = "2.3"
sha2 = "0.10"
notify = { version = "7", optional = true } # File watching for hot-reload


[build-dependencies]
flatbuffers = "24.3.25"
flatc-rust = "0.2"
tonic-build = "0.11"

[dev-dependencies]
egui_kittest = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true
serial_test = "3.1.1"
tokio-test = "0.4"
tracing-test = "0.2"
tracing-subscriber = { version = "0.3", features = ["registry"] }
uuid = { version = "1", features = ["v4"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
nix = { version = "0.29", features = ["term"] }
driver-pvcam = { path = "../driver-pvcam", features = ["mock"] }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hostname = "0.4"
# tokio moved to shared dependencies
tokio = { workspace = true, default-features = false, features = ["sync", "macros", "rt-multi-thread", "time", "fs"] }
tonic = { workspace = true, default-features = false, features = ["transport", "prost", "codegen"] }
prost.workspace = true
# Serial: use common::serial (serial2-tokio) via hardware/serial only; no direct serialport/tokio-serial
# pvcam-sys = { path = "pvcam-sys", optional = true }
visa-rs = { version = "0.5", optional = true }

[features]
# Simplified feature flags (bd-0aqw)
default = ["storage_csv", "serial"]

# High-level Profiles
backend = ["server", "modules", "all_hardware", "storage_csv"]
frontend = ["gui_egui", "networking"]
cli = ["all_hardware", "storage_csv", "scripting", "scripting_python"]
full = ["storage_csv", "storage_arrow", "storage_matlab", "serial", "modules", "server", "all_hardware"]

# NOTE: storage_hdf5 requires native HDF5 installation (libhdf5-dev).
# Omitted from "full" to keep CI working. Enable with --features storage_hdf5.

# Storage backends
storage_csv = ["dep:csv"]
storage_hdf5 = ["dep:hdf5", "storage/storage_hdf5"]
storage_arrow = ["dep:arrow", "storage/storage_arrow", "common/storage_arrow"]
storage_matlab = ["dep:matrw"]

# Serial communication (async via common::serial / serial2-tokio)
serial = ["hardware/serial"]
visa = ["dep:visa-rs"]

# Mock drivers for testing
mock = ["dep:driver-mock"]

# Hardware drivers (standalone crates)
thorlabs = ["serial", "dep:driver-thorlabs", "hardware/thorlabs"]
newport = ["serial", "dep:driver-newport", "hardware/newport"]
spectra_physics = ["serial", "dep:driver-spectra-physics", "hardware/spectra_physics"]
newport_power_meter = ["newport"]
generic = ["serial", "dep:driver-generic", "hardware/generic"]

# PVCAM camera support
pvcam = ["serial", "hardware/pvcam"]
pvcam_sdk = ["pvcam", "hardware/pvcam_sdk"]
pvcam_hardware = ["pvcam_sdk"]

# Comedi DAQ support
comedi = ["dep:driver-comedi", "hardware/comedi", "server/comedi"]
comedi_hardware = ["comedi", "driver-comedi/hardware", "hardware/comedi_hardware", "server/comedi_hardware"]

# All hardware drivers (with mock PVCAM and Comedi)
all_hardware = ["thorlabs", "newport", "spectra_physics", "newport_power_meter", "pvcam", "comedi", "generic"]

# Networking and server
networking = []
server = ["networking", "dep:server", "tokio/full"]
scripting = ["dep:scripting"]
gui_egui = ["dep:egui", "dep:eframe", "dep:egui_plot", "dep:egui_extras"]
modules = ["scripting"]

# Testing
hardware_tests = []
prime_95b_tests = []

# Python scripting backend
scripting_python = ["scripting/python"]

# Plugin hot-reload (development only)
plugins_hot_reload = ["dep:notify"]

# Native plugin loading (abi_stable)
native_plugins = ["dep:plugin-api"]

