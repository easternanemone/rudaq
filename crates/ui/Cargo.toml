[package]
name = "ui"
version = "0.1.0"
edition = "2021"
description = "egui-based control panel for rust-daq"

[lib]
name = "ui"
path = "src/lib.rs"

[[bin]]
name = "rust-daq-gui"
path = "src/main.rs"

[[bin]]
name = "rust-daq-web"
path = "src/web_main.rs"
required-features = ["web"]

[[bin]]
name = "daq-rerun"
path = "src/main_rerun.rs"
required-features = ["rerun_viewer"]

[dependencies]
client = { path = "../client" }
# egui ecosystem (upgraded to 0.33 for Rerun 0.27.3 compatibility)
egui = "0.33"

serde = { workspace = true, features = ["derive"] }

# gRPC client
protocol = { path = "../protocol" }
tonic = { workspace = true, default-features = false, features = ["prost", "codegen"] }
prost.workspace = true

# Error handling and utilities
anyhow.workspace = true
tracing.workspace = true
log = "0.4"
serde_json.workspace = true
futures.workspace = true

# --- Cross-platform egui panel dependencies (used by both standalone and web) ---
egui_extras = { version = "0.33", default-features = false, optional = true }
egui_dock = { version = "0.18", optional = true, features = ["serde"] }
egui_plot = { version = "0.34", optional = true }
egui-phosphor = { version = "0.11", optional = true }

# --- Cross-platform dependencies (pure Rust, compile on native + WASM) ---
egui-snarl = { version = "0.9", features = ["serde"] }
undo = "0.52"
egui_code_editor = "0.2.20"
chrono.workspace = true
toml.workspace = true
url = "2"
find_peaks = "0.1"
ordered-float = "4.5"
web-time = "1"
common = { path = "../common" }

# --- Native-only dependencies ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = { workspace = true, default-features = false, features = ["transport", "prost", "codegen"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }

# eframe with native windowing
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
], optional = true }

dark-light = { version = "2.0", optional = true }

# Rerun for embedded viewer
rerun = { version = "0.27.3", default-features = false, features = [
    "native_viewer",
    "sdk",
    "server",
], optional = true }
mimalloc = { version = "0.1", optional = true }
bytemuck = { version = "1.14", optional = true }

# Native-only workspace crates (depend on mio, serial2, etc.)
experiment = { path = "../experiment" }
hardware = { path = "../hardware" }

tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI parsing and daemon process management
clap = { version = "4", features = ["derive"] }
which = "6"
dirs = "5.0"

# Local PVCAM driver (only needed if running daemon locally, not for gRPC streaming)
driver-pvcam = { path = "../driver-pvcam", optional = true }
rfd = { version = "0.17.2", optional = true }

# HDF5 storage for run comparison and annotation (optional)
storage = { path = "../storage", optional = true }
hdf5 = { package = "hdf5-metno", version = "0.11.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"  # For graceful daemon termination (SIGTERM)

# --- WASM-only dependencies ---
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["sync", "macros"] }

# eframe for web (no wayland/x11, uses WebGL via glow)
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
], optional = true }

js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"

[features]
default = ["standalone"]
# Note: dark-light temporarily removed due to ashpd/zbus version conflict (2025-01-17)
standalone = ["dep:eframe", "dep:egui_extras", "dep:egui_dock", "dep:egui_plot", "dep:egui-phosphor", "dep:rfd"]
# Embedded Rerun viewer with gRPC camera streaming support
rerun_viewer = ["dep:rerun", "dep:mimalloc", "dep:bytemuck", "dep:egui_dock", "dep:egui_plot"]

# Local PVCAM driver support (for running daemon locally)
# - pvcam: enables mock mode (no SDK required)
# - pvcam_sdk: enables real hardware mode (requires PVCAM SDK)
pvcam = ["dep:driver-pvcam"]
pvcam_sdk = ["pvcam", "driver-pvcam/pvcam_sdk"]
pvcam_hardware = ["pvcam_sdk"]

# HDF5 storage support for run comparison and annotation
storage_hdf5 = ["dep:hdf5", "dep:storage", "storage/storage_hdf5"]

# WASM web build — full browser-based GUI (same panels as standalone)
web = ["dep:eframe", "dep:egui_extras", "dep:egui_dock", "dep:egui_plot", "dep:egui-phosphor"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["egui_extras", "prost"]  # egui_extras: feature-gated; prost: used by tonic codegen
