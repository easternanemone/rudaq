<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAQ Control Panel</title>
    <!-- Trunk: compile the rust-daq-web binary with the "web" feature -->
    <link data-trunk rel="rust" data-bin="rust-daq-web" data-cargo-features="web" data-cargo-no-default-features />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Loading spinner shown until WASM initializes */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 16px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading DAQ Control Panel...</div>
    </div>
    <!-- eframe WebRunner renders into this canvas -->
    <canvas id="daq_canvas"></canvas>
    <script>
        // Hide loading spinner once WASM is initialized and canvas is rendering
        const observer = new MutationObserver(() => {
            const canvas = document.getElementById('daq_canvas');
            if (canvas && canvas.width > 0) {
                document.getElementById('loading').style.display = 'none';
                observer.disconnect();
            }
        });
        observer.observe(document.getElementById('daq_canvas'), {
            attributes: true, attributeFilter: ['width', 'height']
        });
        // Fallback: hide after 5s regardless
        setTimeout(() => {
            const el = document.getElementById('loading');
            if (el) el.style.display = 'none';
        }, 5000);
    </script>
</body>
</html>
