[package]
name = "pool"
version = "0.1.0"
edition = "2021"
description = "Zero-allocation object pool for high-performance frame handling"
license = "MIT"

[dependencies]
bytes = "1.11"
crossbeam-queue = "0.3"
parking_lot = "0.12"
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
prometheus = { version = "0.14", optional = true }

[dev-dependencies]
loom = "0.7"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-test = "0.4"

[features]
default = []
metrics = ["dep:prometheus"]

[lints]
workspace = true
