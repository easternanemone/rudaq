# Example NI-DAQmx trigger configurations for rust-daq
#
# Copy this file to your config directory and customize as needed.

# Simple digital trigger for camera
[[devices]]
id = "camera_trigger"
type = "nidaqmx_trigger"
enabled = true

[devices.config]
high_time = 0.1          # 100ms exposure time
low_time = 0.001         # 1ms between pulses
samps_per_chan = 1       # Single pulse
trigger_mode = "digital" # Software triggered
device_name = "Dev1"
counter = "ctr0"

# Trigger-on-position for laser synchronization
[[devices]]
id = "laser_sync_trigger"
type = "nidaqmx_trigger"
enabled = true

[devices.config]
high_time = 0.001        # 1ms pulse width
low_time = 0.001
samps_per_chan = 1
trigger_mode = "trigger_on_position"
trigger_source = "/Dev1/PFI0"  # External trigger input
rising_edge = true
retriggerable = false
device_name = "Dev1"
counter = "ctr0"

# Fast pulse generator for high-speed acquisition
[[devices]]
id = "fast_trigger"
type = "nidaqmx_trigger"
enabled = false

[devices.config]
high_time = 0.00001      # 10µs pulse
low_time = 0.00001       # 10µs low
samps_per_chan = 100     # 100 pulses
trigger_mode = "digital"
device_name = "Dev1"
counter = "ctr1"
