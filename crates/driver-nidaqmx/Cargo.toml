[package]
name = "driver-nidaqmx"
version = "0.1.0"
edition = "2021"
description = "NI-DAQmx driver using PyO3 bridge for rust-daq ecosystem"
license = "MIT OR Apache-2.0"

[dependencies]
# Python FFI bridge
pyo3 = { version = "0.22", features = ["auto-initialize"] }

# Core DAQ traits
common = { path = "../common" }

# Async runtime
tokio = { workspace = true, features = ["sync", "rt", "time"] }
async-trait.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true

# Utilities
parking_lot = "0.12"

# Factory support
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
futures.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile.workspace = true
tracing-subscriber = "0.3"

[features]
default = []
# Enable real hardware support (requires Python 3.x with nidaqmx package installed)
hardware = []

[lints]
workspace = true
