[package]
name = "bin"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rust-daq-daemon"
path = "src/main.rs"

[dependencies]
server = { path = "../server" }
hardware = { path = "../hardware", features = ["serial"] }
driver-registry = { path = "../driver-registry" }
protocol = { path = "../protocol" }
common = { path = "../common" }
echelle = { path = "../echelle" }
storage = { path = "../storage" }
scripting = { path = "../scripting" }
daq-modules = { path = "../daq-modules", optional = true }
driver-mock = { path = "../driver-mock" }
driver-comedi = { path = "../driver-comedi", optional = true }
db = { path = "../db", optional = true }
prometheus = { version = "0.14", optional = true }
client = { path = "../client" }
image = { version = "0.25", default-features = false, features = ["tiff", "png"] }
toml.workspace = true
anyhow.workspace = true
futures.workspace = true
tokio-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio-stream = "0.1"
tonic = { workspace = true, features = ["transport"] }
clap = { version = "4.5.4", features = ["derive"] }
tracing.workspace = true
tokio = { workspace = true, features = ["full"] }
mimalloc = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
libc = "0.2"
tempfile.workspace = true

[features]
default = ["networking", "server", "db"]

# ============================================================================
# CRATE-SPECIFIC (used in #[cfg(feature = "...")] within bin source code)
# ============================================================================
networking = []                         # Gates gRPC server startup, daemon manager networking paths
server = []                             # Guards pvcam_grpc_harness compilation

# ============================================================================
# HYBRID (forwarded to downstream crates AND used in #[cfg] within bin)
# ============================================================================
storage_hdf5 = ["storage/storage_hdf5"]             # cfg-gated storage service wiring in daemon_manager
storage_arrow = ["storage/storage_arrow"]            # cfg-gated storage service wiring in daemon_manager
comedi_hardware = ["driver-registry/comedi_hardware", "server/comedi", "dep:driver-comedi"]  # cfg-gated safety heartbeat + comedi init
modules = ["dep:daq-modules"]                        # Activates optional dep (implicit cfg via dep:)
metrics = ["dep:prometheus", "server/metrics"]        # cfg-gated Prometheus endpoint in watch_reconciler
db = ["dep:db", "server/db"]                          # cfg-gated DB init paths in main + daemon_manager

# Legacy aliases (deprecated — db now uses sqlite by default)
db-surreal = ["db"]
db-surreal-mem = ["db"]
db-surreal-rocksdb = ["db"]

# ============================================================================
# PURE PASS-THROUGH (forwarded only, no #[cfg] usage in bin source)
# ============================================================================
pvcam_sdk = ["driver-registry/pvcam_sdk"]            # Real PVCAM SDK (requires installation)
pvcam_hardware = ["pvcam_sdk"]                       # Alias for pvcam_sdk
serial = ["hardware/serial", "driver-registry/serial"]
all_hardware = ["driver-registry/all_hardware", "server/comedi"]
scripting_python = ["scripting/python"]

# ============================================================================
# HIGH-LEVEL PROFILES (composition of the above features)
# ============================================================================
backend = ["modules", "all_hardware"]
cli = ["all_hardware", "scripting_python"]
full = ["storage_arrow", "serial", "modules", "all_hardware"]
production = ["db", "modules", "all_hardware"]

# ============================================================================
# MAITAI LAB PROFILE - COMPLETE HARDWARE STACK
# ============================================================================
maitai = [
    "pvcam_hardware",              # Real PVCAM SDK (NOT mock)
    "comedi_hardware",             # NI DAQ card (NOT mock)
    "hardware/serial"              # Serial port base
]

# ============================================================================
# LEABS LAB PROFILE - LASER ENERGY ASSISTED BREAKDOWN SPECTROSCOPY
# ============================================================================
leabs = [
    "driver-registry/andor",          # Andor iStar (mock mode)
]

# LEABS real hardware (requires Andor SDK3 on leabs-dev)
leabs_hardware = [
    "driver-registry/andor_hardware", # Andor iStar (real SDK3, requires ANDOR_SDK3_DIR)
]

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["hardware", "driver-registry"]  # Feature passthrough deps
