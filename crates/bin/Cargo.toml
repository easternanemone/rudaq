[package]
name = "bin"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-daq-daemon"
path = "src/main.rs"

[dependencies]
server = { path = "../server" }
hardware = { path = "../hardware", features = ["serial"] }
protocol = { path = "../protocol" }
common = { path = "../common" }
storage = { path = "../storage" }
scripting = { path = "../scripting" }
daq-modules = { path = "../daq-modules", optional = true }
driver-mock = { path = "../driver-mock" }
db = { path = "../db", optional = true }
prometheus = { version = "0.14", optional = true }
toml.workspace = true
anyhow.workspace = true
futures.workspace = true
tokio-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio-stream = "0.1"
tonic = { workspace = true, features = ["transport"] }
clap = { version = "4.5.4", features = ["derive"] }
tracing.workspace = true
tokio = { workspace = true, features = ["full"] }
mimalloc = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
libc = "0.2"
tempfile.workspace = true

[features]
default = ["networking", "server"]
networking = []
server = [] # Enabled by default via dependency, but kept as feature flag for conditional compilation
storage_hdf5 = ["storage/storage_hdf5"]
storage_arrow = ["storage/storage_arrow"]
# Real PVCAM SDK (requires installation)
pvcam_sdk = ["hardware/pvcam_sdk"]
pvcam_hardware = ["pvcam_sdk"]

# Real Comedi hardware (requires libcomedi installed)
comedi_hardware = ["hardware/comedi_hardware"]

# ============================================================================
# HIGH-LEVEL PROFILES
# ============================================================================
backend = ["modules", "all_hardware"]
cli = ["all_hardware", "scripting_python"]
full = ["storage_arrow", "serial", "modules", "all_hardware"]

modules = ["dep:daq-modules"]
all_hardware = ["hardware/all_hardware"]
scripting_python = ["scripting/python"]
serial = ["hardware/serial"]

# ============================================================================
# DATABASE (SurrealDB persistence layer)
# ============================================================================
# Base feature — activates the db crate (use one of the engine features below)
db-surreal = ["dep:db", "server/db-surreal"]
# In-memory engine (fast compile, for dev/test)
db-surreal-mem = ["db-surreal", "db/kv-mem", "server/db-surreal-mem"]
# RocksDB engine (persistent, for production)
db-surreal-rocksdb = ["db-surreal", "db/kv-rocksdb", "server/db-surreal-rocksdb"]

# Prometheus metrics (reconciler observability)
metrics = ["dep:prometheus", "server/metrics"]

# ============================================================================
# MAITAI LAB PROFILE - COMPLETE HARDWARE STACK
# ============================================================================
# This feature flag enables ALL real hardware on the maitai machine.
# CRITICAL: This must include EVERY hardware driver, not just PVCAM!
#
# Build command: bash scripts/build-maitai.sh
# or manually: cargo build --release -p bin --features maitai
#
# Enabled drivers:
#   - pvcam_hardware    : Real PVCAM SDK (Prime BSI camera)
#   - comedi_hardware   : NI PCI-MIO-16XE-10 DAQ card
#   - thorlabs          : ELL14 rotation mounts (rotators 2, 3, 8)
#   - newport           : ESP300 motion controller (axis 1, 2, 3)
#   - spectra_physics   : MaiTai Ti:Sapphire laser
#   - newport_power_meter : Newport 1830-C optical power meter
#   - serial            : Base serial port communication
#
# Expected devices (9+ total):
#   1. prime_bsi (PVCAM camera)
#   2. photodiode, ni_daq_ao0 (Comedi DAQ channels)
#   3. maitai (laser)
#   4. power_meter (Newport 1830-C)
#   5. rotator_2, rotator_3, rotator_8 (ELL14 rotators)
#   6. esp300_axis1, esp300_axis2, esp300_axis3 (Newport motion)
# ============================================================================
maitai = [
    "pvcam_hardware",              # Real PVCAM SDK (NOT mock)
    "comedi_hardware",             # NI DAQ card (NOT mock)
    "hardware/thorlabs",           # ELL14 rotators
    "hardware/newport",            # ESP300 motion controller
    "hardware/spectra_physics",    # MaiTai laser
    "hardware/newport_power_meter",# 1830-C power meter
    "hardware/serial"              # Serial port base
]

# ============================================================================
# LEABS LAB PROFILE - LASER ENERGY ASSISTED BREAKDOWN SPECTROSCOPY
# ============================================================================
# Build: cargo build --release -p bin --features leabs
#
# Enabled drivers:
#   - andor (mock)        : Andor iStar sCMOS (mock mode, SDK not installed)
#   - universal drivers   : IPG laser (TCP), Thorlabs PM400 (TCP)
#
# Expected devices (3):
#   1. ipg_laser (IPG YLPP-200-1-50-R fiber laser)
#   2. istar_camera (Andor iStar sCMOS, mock)
#   3. power_meter (Thorlabs PM400)
# ============================================================================
leabs = [
    "hardware/andor",              # Andor iStar (mock mode)
]

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["hardware"]  # Needed for pvcam feature passthrough
