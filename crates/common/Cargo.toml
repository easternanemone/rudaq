[package]
name = "common"
version = "0.1.0"
edition = "2024"
description = "Core types and traits for rust-daq"
build = "build.rs"

[dependencies]
bytes = { version = "1.11", features = ["serde"] }
parking_lot = "0.12"
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
anyhow.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
futures.workspace = true
tracing.workspace = true
schemars = { version = "0.8", optional = true } # If needed for schema generation
arrow = { version = "57", optional = true, features = ["ipc"] }
hdf5 = { package = "hdf5-metno", version = "0.12.3", optional = true }
fitsio = { version = "0.21", optional = true }
pool = { path = "../pool" }
sha2 = "0.10"  # For graph file hashing
regex-lite = "0.1"  # Lightweight regex for log scrubbing

# Serial port support (optional, for driver crates)
# serial2-tokio: single crate for async serial + port listing (replaces tokio-serial + serialport)
serial2-tokio = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync", "macros", "rt", "rt-multi-thread", "time", "io-util", "fs"] }
tokio-util = { workspace = true }
hostname = "0.4"
rayon.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, default-features = false, features = ["sync", "macros"] }
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.10", features = ["js"] }
wasm-timer = "0.2"

[build-dependencies]
anyhow.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber = "0.3.22"
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
criterion.workspace = true

[[bench]]
name = "libs_benchmarks"
harness = false

[features]
storage_arrow = ["dep:arrow"]
storage_hdf5 = ["dep:hdf5"]
serial = ["dep:serial2-tokio"]  # Serial port support for driver crates
fits = ["dep:fitsio"]  # FITS file I/O for calibration frame import (requires cfitsio C library)

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["getrandom", "schemars"]  # getrandom: wasm32 feature enabler; schemars: optional
