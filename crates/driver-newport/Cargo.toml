[package]
name = "driver-newport"
version = "0.1.0"
edition = "2021"
description = "Newport ESP300 motion controller and 1830-C power meter drivers for rust-daq"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheFermiSea/rust-daq"

[dependencies]
# Core dependencies (DriverFactory trait, capabilities)
common = { path = "../common", features = ["serial"] }

# Async runtime
tokio = { workspace = true, features = ["sync", "time", "io-util", "rt"] }
async-trait.workspace = true
futures.workspace = true

# Serial: use common/serial (serial2-tokio) - no direct tokio-serial/serialport

# Error handling
anyhow.workspace = true

# Configuration
serde = { workspace = true, features = ["derive"] }
toml.workspace = true

# Logging
tracing.workspace = true
log = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
