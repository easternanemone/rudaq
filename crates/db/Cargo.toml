[package]
name = "db"
version = "0.1.0"
edition = "2024"
description = "Embedded SQLite persistence layer for rust-daq (control plane)"
license = "MIT"

[dependencies]
common = { path = "../common" }
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
chrono.workspace = true
toml.workspace = true
futures.workspace = true

# SurrealDB — legacy backend (deprecated, will be removed).
surrealdb = { version = "2", default-features = false, optional = true }

# SQLite — primary backend (bd-2a2ne).
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
tokio-rusqlite = { version = "0.7", optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[features]
default = ["sqlite"]

# SQLite backend — lightweight embedded database (bd-2a2ne).
# ~15 deps, ~20s compile.  Primary backend going forward.
sqlite = ["dep:rusqlite", "dep:tokio-rusqlite"]

# Legacy SurrealDB engines (deprecated — use sqlite instead).
kv-mem = ["dep:surrealdb", "surrealdb/kv-mem"]
kv-rocksdb = ["dep:surrealdb", "surrealdb/kv-rocksdb"]

[[bench]]
name = "startup"
harness = false
required-features = ["kv-mem"]

[lints]
workspace = true
