[package]
name = "db"
version = "0.1.0"
edition = "2021"
description = "Embedded SurrealDB persistence layer for rust-daq (control plane)"

[dependencies]
common = { path = "../common" }
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
chrono.workspace = true
toml.workspace = true
futures.workspace = true

# SurrealDB — optional per storage engine.
# Use `kv-mem` for tests/dev (fast compile), `kv-rocksdb` for production.
# The `Any` engine lets callers decide at runtime.
surrealdb = { version = "2", default-features = false, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[features]
default = []

# In-memory engine — fast compilation, no disk persistence.
# Good for development and unit tests.
kv-mem = ["dep:surrealdb", "surrealdb/kv-mem"]

# RocksDB engine — persistent embedded storage.
# Requires librocksdb; slower to compile.
kv-rocksdb = ["dep:surrealdb", "surrealdb/kv-rocksdb"]

[[bench]]
name = "startup"
harness = false
required-features = ["kv-mem"]

[lints]
workspace = true
