[package]
name = "db"
version = "0.1.0"
edition = "2024"
description = "Embedded SurrealDB persistence layer for rust-daq (control plane)"
license = "MIT"

[dependencies]
common = { path = "../common" }
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
chrono.workspace = true
toml.workspace = true
futures.workspace = true

# SurrealDB — optional per storage engine.
# Use `kv-mem` for tests/dev (fast compile), `kv-rocksdb` for production.
# The `Any` engine lets callers decide at runtime.
surrealdb = { version = "2", default-features = false, optional = true }

# SQLite — lightweight alternative backend (bd-ba6cd).
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
tokio-rusqlite = { version = "0.7", optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[features]
default = ["kv-mem"]

# In-memory engine — fast compilation, no disk persistence.
# Good for development and unit tests.
kv-mem = ["dep:surrealdb", "surrealdb/kv-mem"]

# RocksDB engine — persistent embedded storage.
# Requires librocksdb; slower to compile.
kv-rocksdb = ["dep:surrealdb", "surrealdb/kv-rocksdb"]

# SQLite backend — lightweight replacement for SurrealDB (bd-ba6cd).
# ~15 deps, ~20s compile vs SurrealDB's 118 deps / 10+ min.
# Can be enabled alongside kv-* features (e.g. for migration testing),
# but for production use pick one backend: either `sqlite` or a `kv-*` feature.
sqlite = ["dep:rusqlite", "dep:tokio-rusqlite"]

[[bench]]
name = "startup"
harness = false
required-features = ["kv-mem"]

[lints]
workspace = true
