[package]
name = "client"
version = "0.1.0"
edition = "2024"
description = "gRPC client library for rust-daq daemon"

[lib]
name = "client"
path = "src/lib.rs"

[dependencies]
# gRPC client (prost/codegen are platform-independent; transport is native-only)
protocol = { path = "../protocol" }
common-traits = { path = "../common-traits" }
tonic = { workspace = true, default-features = false, features = ["prost", "codegen"] }

# Async runtime (sync primitives work on all platforms)
tokio = { workspace = true, features = ["sync", "macros"] }
futures.workspace = true

# Error handling and utilities
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
url = "2"
serde = { workspace = true, features = ["derive"] }

# --- Native-only dependencies ---
[features]
default = ["tls"]
tls = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = { workspace = true, default-features = false, features = ["transport", "tls", "tls-roots", "prost", "codegen"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }

# --- WASM-only dependencies ---
[target.'cfg(target_arch = "wasm32")'.dependencies]
# tonic 0.12 compatibility: tonic-web-wasm-client 0.6 (bd-1yzfn).
tonic-web-wasm-client = "0.6"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time", "test-util"] }

[lints]
workspace = true
