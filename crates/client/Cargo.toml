[package]
name = "client"
version = "0.1.0"
edition = "2021"
description = "gRPC client library for rust-daq daemon"

[lib]
name = "client"
path = "src/lib.rs"

[dependencies]
# gRPC client (prost/codegen are platform-independent; transport is native-only)
protocol = { path = "../protocol" }
tonic = { workspace = true, default-features = false, features = ["prost", "codegen"] }

# Async runtime (sync primitives work on all platforms)
tokio = { workspace = true, features = ["sync", "macros"] }
futures.workspace = true

# Error handling and utilities
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
url = "2"
serde = { workspace = true, features = ["derive"] }

# --- Native-only dependencies ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = { workspace = true, default-features = false, features = ["transport", "tls", "prost", "codegen"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }

# --- WASM-only dependencies ---
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pin to =0.5.0: this is the last version compatible with tonic 0.10.
# (0.5.1 bumped to tonic 0.11, 0.6+ requires tonic 0.12)
tonic-web-wasm-client = "=0.5.0"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time", "test-util"] }

[lints]
workspace = true
