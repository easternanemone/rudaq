# Reusable CI workflow snippet for echelle extraction validation.
#
# Add this as a job in your .github/workflows/ pipeline, or include it
# via `uses: ./.github/workflows/echelle-validation.yml` if converted
# to a reusable workflow.
#
# Requires:
#   - Rust-daq extraction JSON output (artifact from a prior build/extract step)
#   - PypeIt reference FITS output (committed to repo or fetched from artifact store)
#
# Usage in a workflow file:
#
#   jobs:
#     echelle-validation:
#       uses: ./.github/workflows/echelle-validation.yml
#       with:
#         rust-json-path: artifacts/echelle/extraction.json
#         pypeit-fits-path: testdata/echelle/reference/spec1d_mechelle.fits

name: Echelle Extraction Validation

on:
  workflow_call:
    inputs:
      rust-json-path:
        description: "Path to rust-daq JSON extraction output"
        required: true
        type: string
      pypeit-fits-path:
        description: "Path to PypeIt spec1d FITS reference file"
        required: true
        type: string
      rust-dir-path:
        description: "Path to directory of rust-daq JSON outputs (alternative to rust-json-path)"
        required: false
        type: string
        default: ""
      pypeit-dir-path:
        description: "Path to directory of PypeIt FITS outputs (alternative to pypeit-fits-path)"
        required: false
        type: string
        default: ""

jobs:
  validate-echelle:
    name: Echelle vs PypeIt Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install numpy astropy scipy matplotlib

      - name: Validate script syntax
        run: python3 -m py_compile scripts/echelle/validate_vs_pypeit.py

      # ── Bright-line validation (strict) ──────────────────────────────
      # Exit code 1 = bright-line failure (science-critical, blocks merge).
      # Exit code 2 = only faint-line failure (handled in next step).
      # Exit code 0 = all pass.
      - name: "Validate: bright lines (strict)"
        id: bright-check
        continue-on-error: false
        run: |
          set +e
          if [ -n "${{ inputs.rust-dir-path }}" ] && [ -n "${{ inputs.pypeit-dir-path }}" ]; then
            python scripts/echelle/validate_vs_pypeit.py \
              --rust-dir "${{ inputs.rust-dir-path }}" \
              --pypeit-dir "${{ inputs.pypeit-dir-path }}" \
              --generate-report validation_report.html \
              --json > validation_result.json
          else
            python scripts/echelle/validate_vs_pypeit.py \
              --rust-json "${{ inputs.rust-json-path }}" \
              --pypeit-fits "${{ inputs.pypeit-fits-path }}" \
              --generate-report validation_report.html \
              --json > validation_result.json
          fi
          EXIT_CODE=$?

          # Exit code 2 means only faint lines failed -- that is acceptable
          # in this step (handled below). Remap to success.
          if [ $EXIT_CODE -eq 2 ]; then
            echo "faint_only_failure=true" >> $GITHUB_OUTPUT
            exit 0
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "faint_only_failure=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "faint_only_failure=false" >> $GITHUB_OUTPUT
            exit $EXIT_CODE
          fi

      # ── Faint-line validation (advisory) ─────────────────────────────
      # Initially non-blocking: continue-on-error allows the pipeline to
      # pass even if faint-line tolerances are exceeded. Remove
      # continue-on-error once faint-line accuracy is stable.
      - name: "Validate: faint lines (advisory)"
        if: steps.bright-check.outputs.faint_only_failure == 'true'
        continue-on-error: true
        run: |
          echo "::warning::Faint-line (SNR 10-100) tolerances exceeded. See validation report for details."
          echo "This is currently non-blocking. Review validation_report.html for specifics."

      # ── Upload report artifact ───────────────────────────────────────
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echelle-validation-report
          path: |
            validation_report.html
            validation_result.json
          retention-days: 30
