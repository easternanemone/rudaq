name: Feature Matrix

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "history/**"
      - ".beads/**"
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "history/**"
      - ".beads/**"

permissions:
  contents: read

concurrency:
  group: feature-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  feature-matrix:
    name: "${{ matrix.name }}"
    runs-on: [self-hosted, Linux, X64, leabs]
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "storage / hdf5"
            package: storage
            features: storage_hdf5
            cache-suffix: storage_hdf5
            timeout: 15
          - name: "storage / arrow"
            package: storage
            features: storage_arrow
            cache-suffix: storage_arrow
            timeout: 15
          - name: "db / rocksdb"
            package: db
            features: kv-rocksdb
            cache-suffix: kv-rocksdb
            timeout: 15
          - name: "bin / all_hardware mock"
            package: bin
            features: all_hardware
            cache-suffix: all_hardware
            timeout: 25
          - name: "server / full stack"
            package: server
            features: modules,scripting,storage_hdf5,storage_arrow
            cache-suffix: modules-scripting-storage_hdf5-storage_arrow
            timeout: 25
          # Runtime-mode smoke tests (bd-9n9k.7)
          - name: "runtime / universal-smoke"
            package: integration-tests
            features: universal
            cache-suffix: universal
            timeout: 35
          # db-surreal-mem is now a default feature; this entry validates
          # the explicit feature path for completeness.
          - name: "runtime / hybrid-db-mem-smoke"
            package: integration-tests
            features: universal,db-surreal-mem
            cache-suffix: universal-db-surreal-mem
            timeout: 35
          # RocksDB must be tested without kv-mem to avoid dual-engine
          # compilation (kv-mem + kv-rocksdb) which prevents the RocksDB
          # process-global lock from releasing on Drop. We use
          # --no-default-features and re-list everything except db-surreal-mem.
          - name: "runtime / hybrid-db-rocksdb-smoke"
            package: integration-tests
            features: networking,server,scripting,storage_hdf5,storage_arrow,serial,modules,pvcam,universal,db-surreal-rocksdb
            cargo-args: "--no-default-features"
            cache-suffix: universal-db-surreal-rocksdb
            timeout: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-daq
        with:
          dependency-profile: minimal
          toolchain: 1.92.0
          components: clippy
          cache-key: feature-matrix-${{ matrix.package }}-${{ matrix.cache-suffix }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Clippy (${{ matrix.name }})
        run: |
          cargo clippy -p ${{ matrix.package }} \
            ${{ matrix.cargo-args || '' }} \
            --features ${{ matrix.features }} \
            --all-targets \
            -- -D warnings

      - name: Tests (${{ matrix.name }})
        run: |
          cargo nextest run -p ${{ matrix.package }} \
            ${{ matrix.cargo-args || '' }} \
            --features ${{ matrix.features }} \
            --profile ci

  # cargo-hack: verify each feature compiles independently and in combination
  # Catches cases where feature A accidentally depends on feature B being enabled
  feature-powerset:
    name: "cargo-hack / ${{ matrix.package }}"
    runs-on: [self-hosted, Linux, X64, leabs]
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: common
            skip_features: ""
          - package: storage
            # hdf5 requires system library
            skip_features: "storage_hdf5"
          - package: driver-registry
            # FFI features need SDK headers not available in CI runner
            skip_features: "comedi,comedi_hardware,pvcam,pvcam_sdk,pvcam_hardware,andor,andor_hardware,all_hardware,full"
          - package: pool
            skip_features: ""
          - package: experiment
            skip_features: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-daq
        with:
          dependency-profile: minimal
          toolchain: 1.92.0
          cache-key: feature-powerset-${{ matrix.package }}

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Feature powerset check
        run: |
          SKIP_ARG=""
          if [ -n "${{ matrix.skip_features }}" ]; then
            SKIP_ARG="--skip ${{ matrix.skip_features }}"
          fi
          cargo hack check -p ${{ matrix.package }} \
            --feature-powerset \
            --no-dev-deps \
            $SKIP_ARG

  wasm-check:
    name: "ui / wasm32 lint + compilation"
    runs-on: [self-hosted, Linux, X64, leabs]
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust with WASM target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: feature-matrix-ui-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check WASM compilation
        run: |
          cargo check -p ui --lib \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --features web

      - name: Clippy WASM target
        run: |
          cargo clippy -p ui --lib \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --features web \
            -- -D warnings
