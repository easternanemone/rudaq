name: Docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
  push:
    branches: ["main"]
    paths:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: Check internal markdown links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check internal links
        run: |
          set -euo pipefail
          errors=0

          # Find all internal markdown links and verify targets exist
          while IFS= read -r file; do
            dir=$(dirname "$file")

            # Extract markdown links: [text](path.md) or [text](path.md#anchor)
            { grep -oP '\[([^\]]*)\]\((?!https?://|mailto:|#)([^)#]+\.md)' "$file" 2>/dev/null || true; } | \
            while IFS= read -r match; do
              target=$(echo "$match" | grep -oP '\((.+)$' | sed 's/^(//')

              # Resolve relative path
              resolved="$dir/$target"
              resolved=$(realpath --relative-to=. "$resolved" 2>/dev/null || echo "$resolved")

              if [ ! -f "$resolved" ]; then
                echo "::error file=$file::Broken link to '$target' (resolved: $resolved)"
                errors=$((errors + 1))
              fi
            done
          done < <(find . -name '*.md' -not -path './.beads/*' -not -path './history/*' -not -path './node_modules/*' -not -path './.git/*')

          if [ "$errors" -gt 0 ]; then
            echo "Found $errors broken internal links"
            exit 1
          fi

          echo "All internal markdown links are valid"
