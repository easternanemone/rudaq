name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "history/**"
      - ".beads/**"
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "history/**"
      - ".beads/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Format, lint, and tests (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-daq
        with:
          dependency-profile: minimal
          toolchain: 1.92.0
          components: clippy,rustfmt
          cache-key: ci-ubuntu-lean

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (workspace scope)
        run: |
          cargo clippy --workspace --all-targets \
            --exclude ui \
            --exclude comedi-sys \
            --exclude driver-comedi \
            -- -D warnings

      - name: Reclaim disk before tests
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h .
          du -sh target || true

          avail_kb=$(df --output=avail . | tail -1 | tr -d ' ')
          min_kb=$((8 * 1024 * 1024))
          if [ "$avail_kb" -lt "$min_kb" ]; then
            echo "Low disk (<8GiB free). Running cargo clean."
            cargo clean
          else
            echo "Sufficient disk, skipping cargo clean."
          fi

          echo "Disk after cleanup:"
          df -h .
          du -sh target || true

      - name: Unit and integration tests
        run: |
          cargo nextest run --workspace --profile ci \
            --exclude ui \
            --exclude comedi-sys \
            --exclude driver-comedi

      - name: Report build artifact sizes
        if: always()
        run: |
          echo "## Build Artifact Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Target directory total
          if [ -d target ]; then
            total=$(du -sh target | awk '{print $1}')
            echo "- **target/ total:** $total" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Key binary sizes (if built)
          for bin in target/debug/daq-daemon target/debug/daq-cli; do
            if [ -f "$bin" ]; then
              size=$(du -sh "$bin" | awk '{print $1}')
              echo "- **$(basename "$bin"):** $size" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          # Disk usage summary
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Disk Usage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          df -h . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
