name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "history/**"
      - ".beads/**"
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "history/**"
      - ".beads/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Format, lint, and tests (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-daq
        with:
          dependency-profile: minimal
          components: clippy,rustfmt
          cache-key: ci-ubuntu-lean

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (Linux-safe workspace scope)
        run: |
          cargo clippy --workspace --all-targets \
            --exclude ui \
            --exclude driver-dover-motion \
            --exclude driver-andor-sdk3 \
            --exclude dover-motion-sys \
            --exclude andor-sdk3-sys \
            --exclude comedi-sys \
            --exclude driver-comedi \
            -- -D warnings

      - name: Unit and integration tests
        run: |
          cargo nextest run --workspace --profile ci \
            --exclude ui \
            --exclude driver-dover-motion \
            --exclude driver-andor-sdk3 \
            --exclude dover-motion-sys \
            --exclude andor-sdk3-sys \
            --exclude comedi-sys \
            --exclude driver-comedi
