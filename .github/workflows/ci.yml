name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "history/**"
      - ".beads/**"
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "history/**"
      - ".beads/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  change-detection:
    name: Detect CI-relevant changes
    runs-on: ubuntu-24.04
    outputs:
      dependency_hygiene: ${{ steps.filter.outputs.dependency_hygiene }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        run: |
          set -euo pipefail

          dependency_hygiene=true
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              base_sha="${{ github.event.pull_request.base.sha }}"
            else
              base_sha="${{ github.event.before }}"
            fi

            if [[ -n "${base_sha}" && ! "${base_sha}" =~ ^0+$ ]]; then
              dependency_hygiene=false
              while IFS= read -r path; do
                case "${path}" in
                  Cargo.toml|Cargo.lock|crates/*/Cargo.toml|crates/*/build.rs|.cargo/**|deny*.toml|scripts/hygiene/**|.github/workflows/ci.yml|.github/actions/setup-daq/**)
                    dependency_hygiene=true
                    break
                    ;;
                esac
              done < <(git diff --name-only "${base_sha}" "${GITHUB_SHA}")
            fi
          fi

          echo "dependency_hygiene=${dependency_hygiene}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Format, lint, and tests (self-hosted)
    runs-on: [self-hosted, Linux, X64, leabs]
    timeout-minutes: 35
    # Serialize all self-hosted jobs to prevent CPU saturation on shared runners.
    # Only one validate job runs at a time across ALL refs (main + PRs).
    concurrency:
      group: self-hosted-runner-ci
      cancel-in-progress: false
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-daq
        with:
          dependency-profile: minimal
          toolchain: 1.92.0
          components: clippy,rustfmt
          cache-key: ci-ubuntu-lean

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (workspace scope)
        run: |
          cargo clippy --workspace --all-targets \
            --exclude ui \
            --exclude comedi-sys \
            --exclude driver-comedi \
            -- -D warnings

      - name: Reclaim disk before tests
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h .
          du -sh target || true

          avail_kb=$(df --output=avail . | tail -1 | tr -d ' ')
          min_kb=$((8 * 1024 * 1024))
          if [ "$avail_kb" -lt "$min_kb" ]; then
            echo "Low disk (<8GiB free). Running cargo clean."
            cargo clean
          else
            echo "Sufficient disk, skipping cargo clean."
          fi

          echo "Disk after cleanup:"
          df -h .
          du -sh target || true

      - name: Unit and integration tests
        run: |
          cargo nextest run --workspace --profile ci \
            --exclude ui \
            --exclude comedi-sys \
            --exclude driver-comedi

      - name: Ring buffer performance benchmark
        # Blocking gate: the test asserts >1,000 FPS for 1 KB mmap writes.
        # This threshold is deliberately conservative for shared CI runners
        # and catches catastrophic regressions (O(n) locking, accidental
        # disk sync). The same assertion also runs in the workspace test
        # suite above; this dedicated step additionally populates the GitHub
        # Step Summary with structured metrics.
        env:
          RUST_DAQ_DEBUG_FRAME_TIMING: "1"
        run: |
          echo "Running ring buffer write throughput benchmark..."
          output=$(cargo nextest run -p storage \
            bench_ring_buffer_write_throughput --profile ci \
            --success-output immediate 2>&1) || {
            echo "$output"
            echo "::error::Ring buffer benchmark did not meet 1,000 FPS threshold"
            exit 1
          }

          # Parse structured output from the test (|| true guards against
          # missing lines under grep when the test fails before printing)
          fps=$(echo "$output" | grep '^fps:' | awk '{print $2}' || true)
          throughput=$(echo "$output" | grep '^throughput:' | awk '{print $2, $3}' || true)
          elapsed=$(echo "$output" | grep '^elapsed_ms:' | awk '{print $2}' || true)
          frames=$(echo "$output" | grep '^frames:' | awk '{print $2}' || true)
          frame_size=$(echo "$output" | grep '^frame_size:' | awk '{print $2, $3}' || true)

          # Report to GitHub Step Summary
          {
            echo "## Ring Buffer Performance Benchmark"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Frames written | ${frames:-N/A} |"
            echo "| Frame size | ${frame_size:-N/A} |"
            echo "| Elapsed | ${elapsed:-N/A} ms |"
            echo "| **FPS** | **${fps:-N/A}** |"
            echo "| **Throughput** | **${throughput:-N/A}** |"
            echo ""
            echo "_Threshold: 1,000 FPS minimum (conservative for shared CI runners). Telemetry enabled via \`RUST_DAQ_DEBUG_FRAME_TIMING=1\`._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Integration benchmarks (lock contention + ring buffer latency)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "Running integration benchmarks..."
          output=$(cargo bench -p integration-tests 2>&1) || {
            echo "$output"
            echo "::error::Integration benchmarks failed"
            exit 1
          }
          echo "$output"

          # Report to GitHub Step Summary
          {
            echo "## Integration Benchmarks"
            echo ""
            echo '```'
            echo "$output" | grep -E '^(---|bench:|operations:|frames:|p50|p95|p99|throughput|fps:|delivery_ratio:)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report build artifact sizes
        if: always()
        run: |
          {
            echo "## Build Artifact Report"
            echo ""

            # Target directory total
            if [ -d target ]; then
              total=$(du -sh target | awk '{print $1}')
              echo "- **target/ total:** $total"
            fi

            # Key binary sizes (if built)
            for bin in target/debug/daq-daemon target/debug/daq-cli; do
              if [ -f "$bin" ]; then
                size=$(du -sh "$bin" | awk '{print $1}')
                echo "- **$(basename "$bin"):** $size"
              fi
            done

            # Disk usage summary
            echo ""
            echo "### Disk Usage"
            echo '```'
            df -h .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  performance-regression:
    name: Performance regression gate
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, leabs]
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-daq
        with:
          dependency-profile: minimal
          toolchain: 1.92.0
          cache-key: ci-performance-gate

      - name: Run performance regression gate
        run: |
          python3 scripts/ci/check-benchmark-regressions.py \
            --output-dir target/performance-gate

      - name: Generate criterion HTML report for ring buffer writes
        run: |
          cargo bench -p storage --bench ring_buffer_write \
            | tee target/performance-gate/ring-buffer-write-criterion.log

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-gate-${{ github.sha }}
          path: |
            target/performance-gate
            target/criterion
          retention-days: 14

  dependency-hygiene:
    name: Dependency hygiene and SBOM
    needs: change-detection
    if: needs.change-detection.outputs.dependency_hygiene == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-daq
        with:
          dependency-profile: minimal
          toolchain: 1.92.0
          cache-key: ci-dependency-hygiene

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Run dependency hygiene gate
        run: bash scripts/hygiene/check-dependency-hygiene.sh

      - name: Install cargo-sbom
        if: github.event_name == 'push'
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-sbom

      - name: Generate SBOM (CycloneDX)
        if: github.event_name == 'push'
        # SBOM generation is best-effort — it should not block CI (bd-qawq)
        continue-on-error: true
        run: |
          cargo sbom --output-format=cdx-json > sbom.cdx.json
          echo "SBOM generated: $(wc -c < sbom.cdx.json) bytes"

      - name: Upload SBOM artifact
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
