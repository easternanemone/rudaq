name: 'Setup Rust DAQ Environment'
description: 'Sets up Rust toolchain and system dependencies for rust-daq'
inputs:
  toolchain:
    description: 'Rust toolchain to install (stable/nightly/etc)'
    required: false
    default: ''
  dependency-profile:
    description: 'System dependency profile: minimal, full, or none'
    required: false
    default: 'minimal'
  python-version:
    description: 'Python version to install'
    required: false
    default: ''
  rust-toolchain:
    description: 'Rust toolchain to install (stable/nightly/etc)'
    required: false
    default: '1.92.0'
  components:
    description: 'Rust components to install'
    required: false
    default: ''
  cache-key:
    description: 'Key suffix for rust-cache'
    required: false
    default: ''
  skip-cache:
    description: 'Skip cargo caching'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Install system dependencies (Linux)
      shell: bash
      if: runner.os == 'Linux' && inputs.dependency-profile != 'none'
      run: |
        set -euo pipefail
        profile="${{ inputs.dependency-profile }}"

        if command -v apt-get >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev \
            libhdf5-dev \
            lld \
            pkg-config \
            protobuf-compiler

          if [ "$profile" = "full" ]; then
            sudo apt-get install -y --no-install-recommends \
              libhdf5-dev \
              libxkbcommon-dev \
              libwayland-dev \
              libxcb-shape0-dev \
              libxcb-xfixes0-dev
          fi
        elif command -v pacman >/dev/null 2>&1; then
          sudo pacman -Sy --noconfirm --needed \
            hdf5 \
            lld \
            pkgconf \
            protobuf

          if [ "$profile" = "full" ]; then
            sudo pacman -Sy --noconfirm --needed \
              libxkbcommon \
              wayland \
              libxcb
          fi
        elif command -v dnf >/dev/null 2>&1; then
          sudo dnf install -y \
            systemd-devel \
            hdf5-devel \
            lld \
            pkgconf-pkg-config \
            protobuf-compiler

          if [ "$profile" = "full" ]; then
            sudo dnf install -y \
              libxkbcommon-devel \
              wayland-devel \
              libxcb-devel
          fi
        else
          echo "::error::Unsupported Linux package manager on runner."
          exit 1
        fi

    - name: Install system dependencies (macOS)
      shell: bash
      if: runner.os == 'macOS' && inputs.dependency-profile == 'full'
      run: |
        set -euo pipefail
        brew install hdf5 protobuf

    - name: Install system dependencies (Windows)
      shell: bash
      if: runner.os == 'Windows' && inputs.dependency-profile == 'full'
      run: |
        set -euo pipefail
        vcpkg install hdf5:x64-windows protobuf:x64-windows
        echo "HDF5_DIR=C:/vcpkg/installed/x64-windows" >> $GITHUB_ENV

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain || inputs['rust-toolchain'] }}
        components: ${{ inputs.components }}

    - name: Cache cargo build
      if: inputs.skip-cache != 'true'
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
