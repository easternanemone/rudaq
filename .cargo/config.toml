# Cargo configuration for rust-daq
# Optimized for macOS M1 Max development

[build]
# Sparse registry protocol is default since Cargo 1.68+

[profile.dev]
incremental = true
# Packed debuginfo: faster linking on macOS (single .dSYM instead of per-object)
split-debuginfo = "packed"

[profile.dev.build-override]
# Optimize build scripts and proc-macros in dev mode for faster builds
opt-level = 2

[profile.dev.package."*"]
# Optimize all dependencies even in dev mode — speeds up tests significantly
# Only your own crates compile unoptimized (for fast incremental rebuilds)
opt-level = 2

[profile.release]
incremental = false
split-debuginfo = "packed"

# Mold linker for faster linking on Linux (opt-in):
# Copy the following into ~/.cargo/config.toml on machines with mold installed:
#   [target.x86_64-unknown-linux-gnu]
#   rustflags = ["-C", "linker=clang", "-C", "link-arg=-fuse-ld=mold"]
# Requires: sudo apt install mold clang
