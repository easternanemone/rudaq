# Demo Hardware Configuration (canonical mock runtime policy)
#
# Universal-eligible instruments run through driver-universal with `mock = true`.
# Camera remains a native mock exception by design.
#
# Usage:
#   rust-daq-daemon daemon --hardware-config config/demo.toml

# ============================================================================
# Universal stage (mock transport)
# ============================================================================

[[devices]]
id = "mock_stage"
name = "Demo Stage (Universal Mock)"
[devices.driver]
type = "universal_newport_esp300"
mock = true
address = "1"

# ============================================================================
# Universal power meter (mock transport)
# ============================================================================

[[devices]]
id = "mock_power_meter"
name = "Demo Power Meter (Universal Mock)"
[devices.driver]
type = "universal_newport_1830-c"
mock = true

# ============================================================================
# Camera native exception
# ============================================================================

[[devices]]
id = "mock_camera"
name = "Demo Camera (Mock)"
[devices.driver]
type = "mock_camera"
width = 640
height = 480
