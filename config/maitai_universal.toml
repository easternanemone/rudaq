# Maitai Lab - Universal TOML-Based Drivers
#
# Hardware config that uses universal (config-driven) driver types instead of
# native hand-coded drivers. Same device IDs, ports, and addressing as
# the original native config so the GUI and experiment scripts work unchanged.
#
# Usage:
#   rust-daq-daemon daemon --hardware-config config/maitai_universal.toml
#
# Notes:
#   - Prime BSI Camera uses native PVCAM driver (requires C SDK)
#   - ESP300 included for bus exercising; may need hardware verification

# ============================================================================
# Photometrics Prime BSI Camera (PVCAM)
# ============================================================================
# Native driver — PVCAM requires C SDK, no universal driver equivalent
# Resolution: 2048x2048, 16-bit

[[devices]]
id = "prime_bsi"
name = "Photometrics Prime BSI Camera"
[devices.driver]
type = "pvcam"
camera_name = "pvcamUSB_0"

# ============================================================================
# Thorlabs ELL14 Rotation Mounts (RS-485 Multidrop Bus)
# ============================================================================
# Three rotators share one serial connection (FT230X)
# Addresses: 2, 3, 8 (set via Thorlabs software)

[[devices]]
id = "rotator_2"
name = "ELL14 Rotator (Address 2)"
[devices.driver]
type = "universal_thorlabs_ell14"
port = "/dev/serial/by-id/usb-FTDI_FT230X_Basic_UART_DK0AHAJZ-if00-port0"
address = "2"

[[devices]]
id = "rotator_3"
name = "ELL14 Rotator (Address 3)"
[devices.driver]
type = "universal_thorlabs_ell14"
port = "/dev/serial/by-id/usb-FTDI_FT230X_Basic_UART_DK0AHAJZ-if00-port0"
address = "3"

[[devices]]
id = "rotator_8"
name = "ELL14 Rotator (Address 8)"
[devices.driver]
type = "universal_thorlabs_ell14"
port = "/dev/serial/by-id/usb-FTDI_FT230X_Basic_UART_DK0AHAJZ-if00-port0"
address = "8"

# ============================================================================
# Spectra-Physics MaiTai Ti:Sapphire Laser
# ============================================================================
# USB-to-USB connection requires 115200 baud (TOML default is 9600 per manual)

[[devices]]
id = "maitai"
name = "MaiTai Ti:Sapphire Laser"
[devices.driver]
type = "universal_spectra-physics_maitai"
port = "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0"
baud_rate = 115200

# ============================================================================
# Newport 1830-C Optical Power Meter
# ============================================================================
# Connected via built-in serial port (RS-232)

[[devices]]
id = "power_meter"
name = "Newport 1830-C Power Meter"
[devices.driver]
type = "universal_newport_1830-c"
port = "/dev/ttyS0"

# ============================================================================
# Newport ESP300 Motion Controller
# ============================================================================
# 3-axis motion controller via FTDI 4-port cable
# Uses {{ address }} in command templates for axis number

[[devices]]
id = "esp300_axis1"
name = "ESP300 Axis 1"
[devices.driver]
type = "universal_newport_esp300"
port = "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Cable_FT1RALWL-if00-port0"
address = "1"

[[devices]]
id = "esp300_axis2"
name = "ESP300 Axis 2"
[devices.driver]
type = "universal_newport_esp300"
port = "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Cable_FT1RALWL-if00-port0"
address = "2"

[[devices]]
id = "esp300_axis3"
name = "ESP300 Axis 3"
[devices.driver]
type = "universal_newport_esp300"
port = "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Cable_FT1RALWL-if00-port0"
address = "3"

# ============================================================================
# Safety Heartbeat (hardware interlock)
# ============================================================================
# Toggles a DIO channel at 100ms to drive an external hardware interlock.
# If the daemon crashes, the pulse stops and the interlock cuts laser power.
# Channel 0 on the DIO subdevice (auto-detected).

[safety_heartbeat]
enabled = true
device = "/dev/comedi0"
channel = 0
interval_ms = 100

# ============================================================================
# Comedi DAQ Card (NI PCI-MIO-16XE-10)
# ============================================================================
# No universal driver — keep native comedi types
# Hardware connections (verified 2026-01-23):
#   DAC1-OUT → ACH0 (loopback test, ~50mV error)
#   DAC0-OUT → EOM amplifier (for laser power control)

[[devices]]
id = "photodiode"
name = "Photodiode Signal (ACH0)"
[devices.driver]
type = "comedi_analog_input"
device = "/dev/comedi0"
channel = 0
range_index = 0
input_mode = "rse"
units = "V"

[[devices]]
id = "ni_daq_ao0"
name = "NI DAQ Analog Output 0 (EOM Control)"
[devices.driver]
type = "comedi_analog_output"
device = "/dev/comedi0"
channel = 0
range_index = 0
units = "V"

[[devices]]
id = "ni_daq_ao1"
name = "NI DAQ Analog Output 1 (Loopback Test)"
[devices.driver]
type = "comedi_analog_output"
device = "/dev/comedi0"
channel = 1
range_index = 0
units = "V"

# ============================================================================
# Comedi Digital I/O (bd-u0lg)
# ============================================================================
# DIO subsystem on the same NI PCI-MIO-16XE-10 card.
# 8 channels, directly configurable as input or output per-pin.
# Registered as a separate device so NiDaqService DIO RPCs route through
# the DeviceRegistry instead of opening /dev/comedi0 directly.

[[devices]]
id = "ni_daq_dio"
name = "NI DAQ Digital I/O"
[devices.driver]
type = "comedi_digital_io"
device = "/dev/comedi0"
output_channels = []

# ============================================================================
# Comedi Counters/Timers (bd-u0lg)
# ============================================================================
# Counter subsystem on the same NI PCI-MIO-16XE-10 card.
# Two 24-bit counter/timer channels (General Purpose Counter/Timer).
# Each registered as a separate device for independent read/reset via registry.

[[devices]]
id = "ni_daq_counter_0"
name = "NI DAQ Counter 0"
[devices.driver]
type = "comedi_counter"
device = "/dev/comedi0"
channel = 0

[[devices]]
id = "ni_daq_counter_1"
name = "NI DAQ Counter 1"
[devices.driver]
type = "comedi_counter"
device = "/dev/comedi0"
channel = 1

# ============================================================================
# Siglent SDG1025 Function Generator (Galvo Drive)
# ============================================================================
# Drives galvo mirrors for beam steering. Two channels: X (CH1) and Y (CH2).
# Adjust DC offset to center the laser spot on the camera sensor.
# Connection: USB rear panel → /dev/ttyUSB* (RS-232 at 115200)
#   or USB-TMC front panel → /dev/usbtmc0

[[devices]]
id = "galvo_driver"
name = "Siglent SDG1025 (Galvo Drive)"
[devices.driver]
type = "universal"
manifest = "config/devices/siglent_sdg1025.toml"
port = "/dev/ttyUSB7"              # Adjust when connected

# ============================================================================
# Thorlabs SC10 Shutter Controller
# ============================================================================
# Solenoid-driven beam shutter for laser safety and experiment gating.
# Connection: USB-to-serial cable → /dev/ttyUSB*

[[devices]]
id = "beam_shutter"
name = "Thorlabs SC10 Beam Shutter"
[devices.driver]
type = "universal"
manifest = "config/devices/thorlabs_sc10.toml"
port = "/dev/ttyUSB8"              # Adjust when connected
