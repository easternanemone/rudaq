# Mechelle 5000 Echelle Spectrograph — Calibration Config
#
# Instrument: Andor Mechelle 5000 with iStar sCMOS detector
# Location:   leabs-dev (10.0.0.40)
# Lamp:       HgAr (Ocean Optics HG-2)
#
# Usage (3-pass pipeline with flat frame for trace detection):
#   rust-daq-daemon calibrate \
#     --frame arc_hgar.tiff \
#     --flat flat_dh3p.tiff \
#     --config config/calibration/mechelle_5000.toml \
#     --output calibrated_profile.toml
#
# Single-frame fallback (arc only):
#   rust-daq-daemon calibrate \
#     --frame arc_hgar.tiff \
#     --config config/calibration/mechelle_5000.toml \
#     --output calibrated_profile.toml

[instrument]
name = "Mechelle 5000 HgAr (leabs-dev)"
# Echelle grating constant: m × λ_center ≈ 36300 nm
# Measured from HgAr arc data (2026-03-16)
grating_constant_nm = 36300.0
# Physical order m=43 is at top of frame (lowest Y, NIR ~844nm)
# Orders increase downward: m=43 (top) → m=116+ (bottom, UV ~313nm)
first_physical_order = 43
# order_step=1: detected order index increases with physical order number
order_step = 1

[detector]
# Andor iStar DH340T: 2048×2048 pixels, 12-bit readout (Mono12 encoding)
# Previous config incorrectly stated 2560×2160 / 16-bit — fixed 2026-03-21
width = 2048
height = 2048
bit_depth = 12

[orientation]
# Dispersion (wavelength) runs along X axis
dispersion_axis = "x"
# Cross-dispersion (order separation) runs along Y axis
cross_dispersion_axis = "y"
# Higher Y → higher physical order number (UV at bottom, NIR at top)
order_number_increase_direction = "positive"
# Wavelength increases left-to-right along each order
wavelength_increase_with_dispersion_positive = true

[tuning]
# Calibration lamp type: "hgar" for OceanInsight HG-2 (mercury-argon, NOT pure mercury)
# Hg lines <600nm, Ar lines >600nm (per Ocean Optics manual 27-MNL-WCS-2)
lamp = "hgar"
# Trace detection: lower SNR threshold for faint UV orders
trace_min_snr = 3.0
# Expected trace FWHM for iStar (slightly broader than research cameras)
trace_fwhm = 4.0
# Minimum peak distance (pixels) — Mechelle 5000 has ~30px order spacing,
# so 10px prevents spurious noise peaks without merging real orders
trace_min_peak_distance = 10
# Arc line detection: relaxed for MCP-amplified signal (higher noise)
arc_sigdetect = 3.0
# Wavelength fit: linear (degree 1) for initial calibration with sparse matches
wl_poly_degree = 1
# Atlas matching tolerance — 5nm accounts for echelle equation approximation (Pass 1)
wl_seed_tolerance_nm = 5.0
# Minimum matched lines per order — 1 enables single-line fallback (bd-3hlp)
# which anchors the echelle equation to a single matched line during Pass 1/2
min_lines_per_order = 1
# Simple summation extraction (optimal extraction needs flat-field)
use_optimal_extraction = false

# 3-Pass Pipeline Configuration (as of 2026-03-18)
#
# Pass 1: Echelle equation seed + atlas matching (5nm tolerance)
#   - Estimates physical order m from trace index using grating_constant_nm
#   - Matches arc lines within 5nm to HgAr atlas
#   - Success: ~42 orders arc-matched
#
# Pass 2: Quadratic regression re-seed
#   - Fits m(i) = a + b*i + c*i² from Pass 1 successes
#   - Re-attempts atlas matching with predicted m values
#   - Improves coverage for marginal orders
#
# Pass 3: Physics bootstrap + 2D Chebyshev residual
#   - For uncalibrated orders: assign m via quadratic interpolation
#   - Compute baseline: λ_base(x,m) = gc/m + disp(m)*(x - w/2)
#   - Fit 2D Chebyshev surface (degree 4×3) to residuals from calibrated orders
#   - Predict wavelengths for remaining uncalibrated orders
#   - Result: ~73 bootstrapped orders, full 230–844nm coverage
