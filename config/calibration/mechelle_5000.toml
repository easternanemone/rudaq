# Mechelle 5000 Echelle Spectrograph — Calibration Config
#
# Instrument: Andor Mechelle 5000 with iStar sCMOS detector
# Location:   leabs-dev (10.0.0.40)
# Lamp:       HgAr (Ocean Optics HG-2)
#
# Usage (literature-standard 3-stage pipeline; flat frame optional for
# trace detection — arc alone also works on high-dynamic-range captures):
#   rust-daq-daemon calibrate \
#     --frame arc_hgar.tiff \
#     --flat flat_dh3p.tiff \
#     --config config/calibration/mechelle_5000.toml \
#     --output calibrated_profile.toml
#
# Single-frame fallback (arc only):
#   rust-daq-daemon calibrate \
#     --frame arc_hgar.tiff \
#     --config config/calibration/mechelle_5000.toml \
#     --output calibrated_profile.toml

[instrument]
name = "Mechelle 5000 HgAr (leabs-dev)"
# Echelle "Order Wavelength Constant": m × λ_center ≈ 20.139 μm = 20139 nm.
# Official value from the Andor Mechelle User Guide v4.2 §4.5.1 p.39 for
# the ME 5000 / DH334T (iStar sCMOS) combination. An Andor service
# representative also recalled this constant as "~201xx" on-site (2026-04).
# An earlier value of 36300 nm was in use pre-2026-04-18; it was
# self-consistent (gc/m produced correct wavelengths locally) but assigned
# physical orders ~1.8× higher than reality, inflating the prism-dispersion
# slope b in the Cauchy-series Y(m) fit. Using the documented value drops
# the Cauchy RMS from 56.6 px to 42.7 px and unlocks Stage-3 global-surface
# synthesis on real hardware captures (bd-sw760 Phase A hardware validation).
grating_constant_nm = 20139.0
# Physical order at the top of the frame (lowest Y, NIR end). With
# gc=20139 and the top of the detector at ~840 nm, NIR-most physical
# order is m ≈ 20139/840 ≈ 24. The on-detector range with step=1 spans
# m=24 → m≈80 (UV limit at 253 nm is m ≈ 20139/253 ≈ 80).
first_physical_order = 24
# order_step=1: detected order index increases with physical order number
order_step = 1

[detector]
# Andor iStar sCMOS: 2560×2160 pixels, 16-bit readout
# The sCMOS sensor is 2560×2160; the camera may stream at reduced
# AOI/binning (e.g., 512×512) depending on settings.
width = 2560
height = 2160
bit_depth = 16

[orientation]
# Dispersion (wavelength) runs along X axis
dispersion_axis = "x"
# Cross-dispersion (order separation) runs along Y axis
cross_dispersion_axis = "y"
# Higher Y → higher physical order number (UV at bottom, NIR at top)
order_number_increase_direction = "positive"
# Wavelength increases left-to-right along each order
wavelength_increase_with_dispersion_positive = true

[tuning]
# Calibration lamp type: "hgar" for OceanInsight HG-2 (mercury-argon, NOT pure mercury)
# Hg lines <600nm, Ar lines >600nm (per Ocean Optics manual 27-MNL-WCS-2)
lamp = "hgar"
# Trace detection: lower SNR threshold for faint UV orders
trace_min_snr = 3.0
# Expected trace FWHM for iStar (slightly broader than research cameras)
trace_fwhm = 4.0
# Minimum peak distance (pixels) — Mechelle 5000 has ~30px order spacing,
# so 10px prevents spurious noise peaks without merging real orders
trace_min_peak_distance = 10
# Arc line detection: relaxed for MCP-amplified signal (higher noise)
arc_sigdetect = 3.0
# Wavelength fit: linear (degree 1) for initial calibration with sparse matches
wl_poly_degree = 1
# Atlas matching tolerance — 5nm accounts for echelle equation approximation (Stage 1)
wl_seed_tolerance_nm = 5.0
# Minimum matched lines per order — 1 enables single-line fallback (bd-3hlp)
# which anchors the echelle equation to a single matched line during Stage 1/2
min_lines_per_order = 1
# Per-order wavelength-fit RMS rejection threshold (nm). Orders whose fit
# residual exceeds this are dropped from the calibrated set.
#
# Bounds the wrong-atlas-line sensitivity that the expanded NIST inventory
# exposes (bd-3yb8.30.1 raised the HgAr atlas from 29 to ~360 Hg I + Ar I
# lines, which increases the density of "within tolerance" candidates per
# detected peak). 0.3 nm is tight enough to reject most spurious matches
# and loose enough to keep ME5000 linear-fit orders that would otherwise
# fail on centroiding noise alone (~0.05–0.1 nm per-line precision × 2–3
# matched lines).
#
# TODO(bd-3yb8.30.2): once progressive seed-tolerance + polynomial
# auto-degree (sub-epic B/C) land, this should drop to 0.1 nm.
max_fit_rms_nm = 0.3
# Simple summation extraction (optimal extraction needs flat-field)
use_optimal_extraction = false

# Optional: merge arc line detections from multiple exposures (HDR-style).
# Primary arc remains --frame; these are *additional* full frames, same ROI/size as [detector].
# Relative paths are resolved from this config file's directory.
# If you enable scattered-light subtraction in the pipeline config, the same model is applied
# to each HDR extra frame (using order geometry from the primary arc) so exposures stay consistent.
#
# [hdr]
# extra_arc_paths = ["arc_short_exposure.tiff", "arc_long_exposure.tiff"]
# merge_tol_px = 1.0
# prefer_unsaturated = true

# Stage-based pipeline configuration (bd-sw760, as of 2026-04-18 after
# literature-standard rewrite — see debug/phase4/v3/LITERATURE-VS-OURS.md
# for the full audit against IRAF, PypeIt, CERES, REDUCE, ESO MIDAS).
#
# Stage 1: Echelle-equation-seeded atlas match (per-order)
#   - For each trace at index i, seed with m = first_physical_order +
#     order_step × i, dispersion = gc/(m²·npx).
#   - Two-phase match: primary window seed_tolerance_nm ± 2 nm, then
#     fallback_tolerance_nm=1 nm. Single-line fallback enabled via
#     min_lines_per_order=1.
#   - No candidate-m search window (non-canonical; collisions are
#     resolved by Stage 2's physical Cauchy model instead).
#
# Stage 2: Cauchy-series Y(m) = a + b/m² + c/m⁴ re-assignment
#   - Fits the Cauchy dispersion series from Stage-1 anchors
#     {(y_centroid, m)}, with 3σ-clipped iterative rejection.
#   - Inverts for each uncalibrated trace's y-centroid to predict m
#     physically; retries two-phase match with the predicted m.
#   - Implementation: crates/echelle/src/cauchy_dispersion.rs.
#
# Stage 3: Global 2D Chebyshev fit λ(x, m) + per-order synthesis
#   - Fits all matched arc lines across all orders simultaneously
#     (degrees 3×5, CERES default; 3σ iterative rejection).
#   - For traces still without per-order matches, synthesizes an
#     OrderWlSolution by sampling the surface at (x, m_Cauchy) and
#     fitting a 1D Chebyshev to the samples (PypeIt-style recovery).
#   - Implementation: crates/echelle/src/chebyshev_2d.rs +
#     calibration_pipeline::refine_with_global_surface.
