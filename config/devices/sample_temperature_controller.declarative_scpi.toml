# NOTE: Sample configuration demonstrating v2 declarative SCPI format.

schema_version = 2
name = "Acme TC-2000 Temperature Controller"
version = "1.0.0"

[connection]
type = "serial"
baud_rate = 9600
terminator = "\r\n"
timeout_ms = 2000

[commands.get_temperature]
template = "TEMP?"
query = true
response_type = "float"

[commands.set_setpoint]
template = "SETP {{ value }}"
query = false
response_type = "none"

[capabilities.readable]
read = "get_temperature"

[[instances]]
id = "tc2000"
name = "Acme TC-2000 Temperature Controller"
port = "/dev/ttyUSB0"
address = "0"
disable = true
