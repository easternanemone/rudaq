schema_version = 3

[capabilities.readable.read]
command = "read_peak"

[capabilities.spectrum_readable]
axis_units = "nm"
spectrum_length = 1024
value_units = "counts"

[capabilities.spectrum_readable.read_spectrum]
command = "read_spectrum"

[commands.get_integration]
description = "Query integration time"
response = "single_float"
template = "SENS:INT?"

[commands.read_peak]
description = "Read the peak intensity value"
response = "single_float"
template = "MEAS:PEAK?"

[commands.read_spectrum]
description = "Read the full 1D spectrum (comma-separated intensities)"
response = "csv_floats"
template = "MEAS:SPEC?"

[commands.set_integration]
description = "Set integration time"
template = "SENS:INT {{ value }}"

[connection]
host = "192.168.1.100"
port = 5025
timeout_ms = 5000
type = "tcp"

[device]
capabilities = [
    "SpectrumReadable",
    "Readable",
    "Parameterized",
]
category = "detector"
description = "1D fiber-coupled spectrometer with configurable integration time"
manufacturer = "Generic"
model = "SPEC-1024"
name = "Generic Spectrometer"
protocol = "scpi"

[parameters.averaging]
default = 1
description = "Number of averages"
range = [
    1,
    1000,
]
read_command = "SENS:AVER?"
type = "int"
write_command = "SENS:AVER {{ value }}"

[parameters.integration_time_ms]
default = 100.0
description = "Integration time"
range = [
    0.1,
    60000.0,
]
read_command = "SENS:INT?"
type = "float"
unit = "ms"
write_command = "SENS:INT {{ value }}"

[responses.csv_floats]
format = "{value}"
type = "format"

[responses.single_float]
format = "{value}"
type = "format"

[ui]
panel_kind = "detector"
