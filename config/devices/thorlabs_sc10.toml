schema_version = 3

[capabilities.shutter_control.close]
command = "close_shutter"

[capabilities.shutter_control.is_open]
command = "get_shutter_state"
output_field = "value"

[capabilities.shutter_control.open]
command = "open_shutter"

[commands.close_shutter]
delay_ms = 50
description = "Close the beam shutter"
expects_response = false
template = "close"

[commands.get_interlock]
description = "Query interlock state (0=OK, 1=tripped)"
response = "interlock_response"
template = "interlock?"

[commands.get_mode]
description = "Query operating mode"
response = "mode_response"
template = "mode?"

[commands.get_open_time]
description = "Query open time in ms"
response = "strip_prompt_int"
template = "topen?"

[commands.get_repeat_count]
description = "Query repeat count"
response = "strip_prompt_int"
template = "rep?"

[commands.get_shutter_count]
description = "Query total shutter cycles"
response = "strip_prompt_int"
template = "shut?"

[commands.get_shutter_state]
description = "Query shutter enable state (0=closed, 1=open)"
response = "bool_01"
template = "ens?"

[commands.identify]
description = "Query device identity"
response = "strip_prompt"
template = "id?"

[commands.open_shutter]
delay_ms = 50
description = "Open the beam shutter"
expects_response = false
template = "open"

[commands.set_auto_mode]
description = "Set auto mode (timed open)"
expects_response = false
template = "mode=2"

[commands.set_manual_mode]
description = "Set manual mode (open/close via commands)"
expects_response = false
template = "mode=1"

[commands.set_mode_raw]
description = "Set operating mode (1-5)"
expects_response = false
template = "mode={{ value }}"

[commands.set_mode_raw.parameters]
value = "int"

[commands.set_open_time]
description = "Set open time in ms"
expects_response = false
template = "topen={{ value }}"

[commands.set_open_time.parameters]
value = "int"

[commands.set_repeat_count]
description = "Set repeat count"
expects_response = false
template = "rep={{ value }}"

[commands.set_repeat_count.parameters]
value = "int"

[connection]
baud_rate = 9600
terminator_rx = "\r"
terminator_tx = "\r"
timeout_ms = 1000
type = "serial"

[device]
capabilities = [
    "ShutterControl",
    "Parameterized",
    "Commandable",
]
category = "modulator"
description = "Optical beam shutter controller for laser safety and experiment gating"
manufacturer = "Thorlabs"
model = "SC10"
name = "Thorlabs SC10"
protocol = "thorlabs_sc10"

[emulator]
identity = "SC10"
mode = "echo"

[[emulator.responses]]
pattern = 'id\?'
response = "> {{ identity }}"

[[emulator.responses]]
pattern = 'ens\?'
response = "> {{ shutter }}"

[[emulator.responses]]
pattern = "^open$"

[emulator.responses.set_state]
shutter = "1"

[[emulator.responses]]
pattern = "^close$"

[emulator.responses.set_state]
shutter = "0"

[[emulator.responses]]
pattern = 'mode\?'
response = "> {{ mode }}"

[[emulator.responses]]
pattern = 'mode=(\d)'

[emulator.responses.set_state]
mode = "$1"

[[emulator.responses]]
pattern = 'topen\?'
response = "> {{ open_time }}"

[[emulator.responses]]
pattern = 'topen=(\d+)'

[emulator.responses.set_state]
open_time = "$1"

[[emulator.responses]]
pattern = 'rep\?'
response = "> {{ repeat_count }}"

[[emulator.responses]]
pattern = 'rep=(\d+)'

[emulator.responses.set_state]
repeat_count = "$1"

[[emulator.responses]]
pattern = 'shut\?'
response = "> {{ shutter_count }}"

[[emulator.responses]]
pattern = 'interlock\?'
response = "> {{ interlock }}"

[emulator.state]
interlock = "0"
mode = "1"
open_time = "10"
repeat_count = "1"
shutter = "0"
shutter_count = "0"

[[init_sequence]]
command = "identify"
delay_ms = 200
description = "Verify SC10 identity"
expect = "SC10"
required = true

[[init_sequence]]
command = "set_manual_mode"
delay_ms = 100
description = "Set to manual mode for command-driven control"
required = false

[[init_sequence]]
command = "get_shutter_state"
delay_ms = 100
description = "Read initial shutter state"
required = false

[parameters.interlock_ok]
default = true
description = "Interlock state (true = OK, false = tripped)"
read_command = "get_interlock"
read_only = true
type = "bool"

[parameters.mode]
choices = [
    "manual",
    "auto",
    "single",
    "repeat",
    "external",
]
default = "manual"
description = "Operating mode (1=manual, 2=auto, 3=single, 4=repeat, 5=external)"
read_command = "get_mode"
type = "string"
write_command = "set_mode_raw"

[parameters.open_time_ms]
default = 10
description = "Shutter open time for auto/single modes"
range = [
    1,
    999999,
]
read_command = "get_open_time"
type = "int"
unit = "ms"
write_command = "set_open_time"

[parameters.repeat_count]
default = 1
description = "Number of open/close cycles in repeat mode"
range = [
    1,
    99,
]
read_command = "get_repeat_count"
type = "int"
write_command = "set_repeat_count"

[parameters.shutter_cycles]
default = 0
description = "Total shutter open/close cycles (lifetime counter)"
read_command = "get_shutter_count"
read_only = true
type = "int"

[parameters.shutter_open]
default = false
description = "Shutter state (true = open, false = closed)"
read_command = "get_shutter_state"
read_only = true
type = "bool"

[responses.bool_01]
transform = [
    "trim",
    "remove_prefix('>')",
    "trim",
]

[responses.interlock_response]
transform = [
    "trim",
    "remove_prefix('>')",
    "trim",
    "map('0', 'true')",
    "map('1', 'false')",
]

[responses.mode_response]
transform = [
    "trim",
    "remove_prefix('>')",
    "trim",
    "map('1', 'manual')",
    "map('2', 'auto')",
    "map('3', 'single')",
    "map('4', 'repeat')",
    "map('5', 'external')",
]

[responses.strip_prompt]
transform = [
    "trim",
    "remove_prefix('>')",
]

[responses.strip_prompt_int]
transform = [
    "trim",
    "remove_prefix('>')",
    "trim",
    "to_int",
]

[ui]
color = "#FF5722"
icon = "shield"
panel_kind = "generic"

[ui.control_panel]
layout = "vertical"

[[ui.control_panel.sections]]
command = "open_shutter"
label = "Open Shutter"
style = "success"
type = "custom_action"

[[ui.control_panel.sections]]
command = "close_shutter"
label = "Close Shutter"
style = "danger"
type = "custom_action"

[[ui.control_panel.sections]]
compact = true
label = "State"
parameters = [
    "shutter_open",
    "interlock_ok",
]
type = "status_display"

[[ui.control_panel.sections]]
label = "Configuration"
type = "separator"

[[ui.control_panel.sections]]
label = "Mode"
parameter = "mode"
type = "parameter"
widget = "dropdown"

[[ui.control_panel.sections]]
label = "Open Time"
parameter = "open_time_ms"
type = "parameter"
widget = "spinner"

[[ui.control_panel.sections]]
label = "Repeat Count"
parameter = "repeat_count"
type = "parameter"
widget = "spinner"

[[ui.control_panel.sections]]
compact = true
label = "Lifetime Cycles"
parameters = ["shutter_cycles"]
type = "status_display"
