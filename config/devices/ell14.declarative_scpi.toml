# NOTE: ELL14 uses Elliptec binary protocol with no terminator and hex payloads.
# The current v2 declarative SCPI driver cannot express this protocol yet.

schema_version = 2
name = "Thorlabs ELL14"
version = "1.0.0"

[connection]
type = "serial"
baud_rate = 9600
terminator = "\n"
timeout_ms = 1000

[commands]

[capabilities]

[[instances]]
id = "ell14"
name = "Thorlabs ELL14"
port = "/dev/ttyUSB0"
address = "0"
disable = true
