schema_version = 3

[capabilities.readable.read]
command = "read_power"
output_field = "value"

[capabilities.wavelength_tunable.get_wavelength]
command = "get_wavelength"
output_field = "value"

[capabilities.wavelength_tunable.set_wavelength]
command = "set_wavelength"
from_param = "wavelength_nm"

[commands.clear_status]
description = "Clear status (zero power reading)"
expects_response = false
template = "CS"

[commands.disable_echo]
description = "Disable echo mode (prevents command echo before response)"
expects_response = false
template = "E0"

[commands.get_range]
description = "Query range setting (1-8)"
response = "range"
template = "R?"

[commands.get_units]
description = "Query units setting (1=W, 2=dBm, 3=dB, 4=REL) - 1-indexed"
response = "units"
template = "U?"

[commands.get_wavelength]
description = "Query wavelength setting"
response = "wavelength"
template = "W?"

[commands.read_power]
description = "Query power measurement (returns Watts in scientific notation)"
response = "power"
template = "D?"

[commands.set_attenuator_off]
description = "Disable attenuator"
expects_response = false
template = "A0"

[commands.set_attenuator_on]
description = "Enable attenuator"
expects_response = false
template = "A1"

[commands.set_filter_fast]
description = "Set filter to Fast (shortest integration time)"
expects_response = false
template = "F3"

[commands.set_filter_medium]
description = "Set filter to Medium"
expects_response = false
template = "F2"

[commands.set_filter_slow]
description = "Set filter to Slow (longest integration time)"
expects_response = false
template = "F1"

[commands.set_units_watts]
description = "Set units to Watts (required for scientific notation response)"
expects_response = false
template = "U1"

[commands.set_wavelength]
description = "Set wavelength for accurate measurement (4-digit format)"
expects_response = false
template = "W{{ wavelength_nm | int | pad(4, '0') }}"

[commands.set_wavelength.parameters]
wavelength_nm = "int32"

[connection]
baud_rate = 9600
terminator_rx = """

"""
terminator_tx = """

"""
timeout_ms = 1000
type = "serial"

[device]
capabilities = [
    "Readable",
    "WavelengthTunable",
    "Parameterized",
]
category = "power_meter"
description = "Optical power meter with wavelength compensation"
manufacturer = "Newport"
model = "1830-C"
name = "Newport 1830-C"
protocol = "newport_1830c"

[error_codes.ERR]
description = "General error"
name = "Error"
recoverable = true

[error_codes.OVER]
description = "Power reading above range"
name = "Overrange"
recoverable = true

[error_codes.SAT]
description = "Detector saturated (overloaded)"
name = "Saturated"
recoverable = true

[error_codes.UNDER]
description = "Power reading below range"
name = "Underrange"
recoverable = true

[[init_sequence]]
command = "disable_echo"
delay_ms = 100

[[init_sequence]]
command = "set_units_watts"
delay_ms = 100

[parameters.attenuator]
default = false
description = "Attenuator state (true=enabled, false=disabled)"
type = "bool"

[parameters.filter]
default = 2
description = "Filter setting (1=Slow, 2=Medium, 3=Fast)"
range = [
    1,
    3,
]
type = "int"

[parameters.wavelength_nm]
default = 800.0
description = "Detector calibration wavelength"
range = [
    300.0,
    1100.0,
]
type = "float"
unit = "nm"

[responses.power]
transform = [
    "trim",
    "to_float",
]

[responses.range]
transform = [
    "trim",
    "to_int",
]

[responses.units]
transform = [
    "trim",
    "to_int",
]

[responses.wavelength]
transform = [
    "trim",
    "to_float",
]

[ui]
panel_kind = "power_meter"
