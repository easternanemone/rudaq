schema_version = 3

[capabilities.emission_control.disable]
command = "emission_off"

[capabilities.emission_control.enable]
command = "emission_on"

[capabilities.readable.read]
command = "get_power"
output_field = "value"

[capabilities.shutter_control.close]
command = "close_shutter"

[capabilities.shutter_control.is_open]
command = "get_shutter"
output_field = "value"

[capabilities.shutter_control.open]
command = "open_shutter"

[capabilities.wavelength_tunable.get_wavelength]
command = "get_wavelength"
output_field = "value"

[capabilities.wavelength_tunable.set_wavelength]
command = "set_wavelength"
from_param = "wavelength"

[commands.close_shutter]
description = "Close the beam shutter (manual: SHUTter 0)"
expects_response = false
template = "SHUT 0"

[commands.emission_off]
description = "Disable laser emission (manual: OFF)"
expects_response = false
template = "OFF"

[commands.emission_on]
description = "Enable laser emission (manual: ON)"
expects_response = false
template = "ON"

[commands.get_diode1_current_pct]
description = "Query pump diode 1 current (% of max)"
response = "percent"
template = "READ:PLASER:DIODE1:CURRENT?"

[commands.get_diode1_temp_c]
description = "Query pump diode 1 temperature (C)"
response = "temperature_c"
template = "READ:PLASER:DIODE1:TEMPERATURE?"

[commands.get_diode2_current_pct]
description = "Query pump diode 2 current (% of max)"
response = "percent"
template = "READ:PLASER:DIODE2:CURRENT?"

[commands.get_diode2_temp_c]
description = "Query pump diode 2 temperature (C)"
response = "temperature_c"
template = "READ:PLASER:DIODE2:TEMPERATURE?"

[commands.get_power]
description = "Query laser output power (manual: READ:POWer?)"
response = "power"
template = "READ:POW?"

[commands.get_pump_current]
description = "Query pump current (% of max)"
response = "percent"
template = "READ:PLASER:PCURRENT?"

[commands.get_pump_power]
description = "Query pump laser power (W)"
response = "power"
template = "READ:PLASER:POWER?"

[commands.get_shg_status]
description = "Query SHG crystal health/status code"
response = "status_code"
template = "READ:PLASER:SHGS?"

[commands.get_shutter]
description = "Query shutter state (manual: SHUTter?)"
response = "shutter_state"
template = "SHUT?"

[commands.get_warmup_percent]
description = "Query laser warmup completion percent"
response = "percent"
template = "READ:PCTWARMEDUP?"

[commands.get_wavelength]
description = "Query current wavelength (manual: WAVelength?)"
response = "wavelength"
template = "WAV?"

[commands.identify]
description = "Query device identity (SCPI standard)"
response = "identity"
template = "*IDN?"

[commands.open_shutter]
description = "Open the beam shutter (manual: SHUTter 1)"
expects_response = false
template = "SHUT 1"

[commands.set_wavelength]
description = "Set output wavelength in nm (manual: WAVelength xxx)"
expects_response = false
template = "WAV {{ wavelength }}"

[commands.set_wavelength.parameters]
wavelength = "float"

[connection]
baud_rate = 9600
data_bits = 8
flow_control = "software"
parity = "none"
stop_bits = 1
terminator_rx = """

"""
terminator_tx = """
\r
"""
timeout_ms = 5000
type = "serial"

[device]
capabilities = [
    "Readable",
    "WavelengthTunable",
    "ShutterControl",
    "EmissionControl",
    "Parameterized",
    "Commandable",
]
category = "source"
description = "Tunable Ti:Sapphire laser (690-1040 nm)"
manufacturer = "Spectra-Physics"
model = "MaiTai"
name = "Spectra-Physics MaiTai"
protocol = "maitai"

[error_codes.ERR]
description = "General error"
name = "Error"
recoverable = true

[[init_sequence]]
command = "identify"
description = "Query device identity to verify MaiTai is connected"
expect = "MaiTai"
required = true

[[init_sequence]]
command = "get_shutter"
delay_ms = 100
description = "Query initial shutter state"
required = false

[parameters.emission_enabled]
default = false
description = "Laser emission state"
type = "bool"

[parameters.shutter_open]
default = false
description = "Shutter state (true=open, false=closed)"
type = "bool"

[parameters.wavelength_max]
default = 1040.0
description = "Maximum tuning wavelength"
read_only = true
type = "float"
unit = "nm"

[parameters.wavelength_min]
default = 690.0
description = "Minimum tuning wavelength"
read_only = true
type = "float"
unit = "nm"

[parameters.wavelength_nm]
default = 800.0
description = "Tunable laser wavelength"
range = [
    690.0,
    1040.0,
]
type = "float"
unit = "nm"

[responses.identity]
transform = ["trim"]

# Shared by 4 commands (diode1/2 current, pump current, warmup%) with differing
# READ:... prefixes, so a single format(...) variant is not practical — keep regex_extract.
[responses.percent]
transform = [
    "trim",
    '''regex_extract('([-+]?\d+(?:\.\d+)?)', 1)''',
    "to_float",
]

[responses.power]
transform = [
    "trim",
    "remove_suffix('W')",
    "remove_suffix('w')",
    "to_float",
]

[responses.shutter_state]
transform = [
    "trim",
    "to_int",
]

# Generic signed-integer extractor for SHG status — kept as regex_extract.
[responses.status_code]
transform = [
    "trim",
    '''regex_extract('(-?\d+)', 1)''',
    "to_int",
]

# Shared by both diode temperature commands with differing prefixes — keep regex_extract.
[responses.temperature_c]
transform = [
    "trim",
    '''regex_extract('([-+]?\d+(?:\.\d+)?)', 1)''',
    "to_float",
]

[responses.wavelength]
transform = [
    "trim",
    "remove_suffix('nm')",
    "remove_suffix('NM')",
    "to_float",
]

[ui]
color = "#E91E63"
icon = "laser"
panel_kind = "maitai"

[ui.control_panel]
layout = "vertical"
show_header = true

[[ui.control_panel.sections]]
label = "Wavelength Tuning"
presets = [
    700.0,
    750.0,
    800.0,
    850.0,
    900.0,
    950.0,
    1000.0,
]
show_color = true
show_slider = true
type = "wavelength"

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
label = "Beam Shutter"
toggle_style = true
type = "shutter"

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
label = "Output Power"
precision = 2
refresh_ms = 1000
show_trend = true
type = "sensor"
unit = "mW"

[[ui.control_panel.sections]]
compact = true
label = "Status"
parameters = ["emission_enabled"]
type = "status_display"

[ui.status_display]
show_connection = true
summary_format = "{{ wavelength_nm }} nm | Shutter: {{ shutter_open }}"
summary_params = [
    "wavelength_nm",
    "shutter_open",
]
