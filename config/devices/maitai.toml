# config/devices/maitai.toml
# Spectra-Physics MaiTai Ti:Sapphire Laser - Protocol Definition
#
# This configuration defines the MaiTai protocol for config-driven
# driver instantiation. It enables creating a GenericSerialDriver that
# behaves identically to the hand-coded MaiTaiDriver.
#
# Reference: MaiTai HP/MaiTai XF User's Manual
#
# Protocol Notes:
# - Format: ASCII command/response over RS-232
# - Baud: 9600, 8N1, software flow control (XON/XOFF)
# - Command terminator: CR+LF (\r\n)
# - Response terminator: LF (\n)
# - Response format: "820nm" for wavelength, "0"/"1" for shutter

schema_version = 3

[device]
name = "Spectra-Physics MaiTai"
description = "Tunable Ti:Sapphire laser (690-1040 nm)"
manufacturer = "Spectra-Physics"
model = "MaiTai"
protocol = "maitai"
category = "source"
capabilities = ["Readable", "WavelengthTunable", "ShutterControl", "Parameterized"]

# ==============================================================================
# Connection Settings
# ==============================================================================

[connection]
type = "serial"
baud_rate = 9600
data_bits = 8
parity = "none"
stop_bits = 1
flow_control = "software"     # XON/XOFF required for MaiTai
timeout_ms = 5000
terminator_tx = "\r\n"        # CR+LF for commands
terminator_rx = "\n"          # LF for responses

# ==============================================================================
# Device Parameters
# ==============================================================================

[parameters.wavelength_nm]
type = "float"
default = 800.0
range = [690.0, 1040.0]
unit = "nm"
description = "Tunable laser wavelength"

[parameters.wavelength_min]
type = "float"
default = 690.0
unit = "nm"
description = "Minimum tuning wavelength"
read_only = true

[parameters.wavelength_max]
type = "float"
default = 1040.0
unit = "nm"
description = "Maximum tuning wavelength"
read_only = true

[parameters.shutter_open]
type = "bool"
default = false
description = "Shutter state (true=open, false=closed)"

[parameters.emission_enabled]
type = "bool"
default = false
description = "Laser emission state"

# ==============================================================================
# Command Definitions
# ==============================================================================

# --- Wavelength Commands ---

[commands.set_wavelength]
template = "WAVELENGTH:{{ wavelength }}"
description = "Set output wavelength (nm)"
parameters = { wavelength = "float" }
expects_response = false

[commands.get_wavelength]
template = "WAVELENGTH?"
description = "Query current wavelength"
response = "wavelength"

# --- Shutter Commands ---

[commands.open_shutter]
template = "SHUTter:1"
description = "Open the beam shutter"
expects_response = false

[commands.close_shutter]
template = "SHUTter:0"
description = "Close the beam shutter"
expects_response = false

[commands.get_shutter]
template = "SHUTTER?"
description = "Query shutter state"
response = "shutter_state"

# --- Emission Commands ---

[commands.emission_on]
template = "ON"
description = "Enable laser emission"
expects_response = false

[commands.emission_off]
template = "OFF"
description = "Disable laser emission"
expects_response = false

# --- Power Query ---

[commands.get_power]
template = "POWER?"
description = "Query laser output power"
response = "power"

# --- Identity Query ---

[commands.identify]
template = "*IDN?"
description = "Query device identity"
response = "identity"

# ==============================================================================
# Response Definitions
# ==============================================================================

# Wavelength response: "820nm" or "820NM"
# Strip suffix and convert to float
[responses.wavelength]
transform = ["trim", "remove_suffix('nm')", "remove_suffix('NM')", "to_float"]

# Shutter state response: "0" or "1"
[responses.shutter_state]
transform = ["trim", "to_int"]

# Power response: MaiTai returns bare numeric values (e.g., "3.00")
[responses.power]
transform = ["trim", "to_float"]

# Identity response: free-form string
[responses.identity]
transform = ["trim"]

# ==============================================================================
# Error Code Mapping
# ==============================================================================

[error_codes."ERR"]
name = "Error"
description = "General error"
recoverable = true

# ==============================================================================
# Capability Mapping: Readable
# ==============================================================================

[capabilities.readable]
read = { command = "get_power", output_field = "value" }

# ==============================================================================
# Capability Mapping: WavelengthTunable
# ==============================================================================

[capabilities.wavelength_tunable]
set_wavelength = { command = "set_wavelength", input_param = "wavelength", from_param = "wavelength_nm" }
get_wavelength = { command = "get_wavelength", output_field = "wavelength" }

# ==============================================================================
# Capability Mapping: ShutterControl
# ==============================================================================

[capabilities.shutter_control]
open = { command = "open_shutter" }
close = { command = "close_shutter" }
is_open = { command = "get_shutter", output_field = "state" }

# ==============================================================================
# Initialization Sequence
# ==============================================================================
# Validates device identity on connection to fail-fast if wrong device

[[init_sequence]]
command = "identify"
description = "Query device identity to verify MaiTai is connected"
required = true
expect = "MaiTai"

[[init_sequence]]
command = "get_shutter"
description = "Query initial shutter state"
required = false
delay_ms = 100

# ==============================================================================
# UI Configuration
# ==============================================================================

[ui]
icon = "laser"
color = "#E91E63"

[ui.control_panel]
layout = "vertical"
show_header = true

[[ui.control_panel.sections]]
type = "wavelength"
label = "Wavelength Tuning"
show_slider = true
presets = [700.0, 750.0, 800.0, 850.0, 900.0, 950.0, 1000.0]
show_color = true

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
type = "shutter"
label = "Beam Shutter"
toggle_style = true

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
type = "sensor"
label = "Output Power"
precision = 2
unit = "mW"
show_trend = true
refresh_ms = 1000

[[ui.control_panel.sections]]
type = "status_display"
label = "Status"
parameters = ["emission_enabled"]
compact = true

[ui.status_display]
summary_params = ["wavelength_nm", "shutter_open"]
summary_format = "{{ wavelength_nm }} nm | Shutter: {{ shutter_open }}"
show_connection = true
