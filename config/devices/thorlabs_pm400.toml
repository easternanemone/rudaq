schema_version = 3

[capabilities.readable.read]
command = "read_power"
output_field = "value"

[capabilities.wavelength_tunable.get_wavelength]
command = "get_wavelength"
output_field = "value"

[capabilities.wavelength_tunable.set_wavelength]
command = "set_wavelength"
from_param = "value"

[commands.get_autorange]
description = "Query auto-range state"
response = "scpi_int"
template = "SENSe:POWer:DC:RANGe:AUTO?"

[commands.get_wavelength]
description = "Query current correction wavelength (nm)"
response = "scpi_float"
template = "SENSe:CORRection:WAVelength?"

[commands.identify]
description = "Query instrument identification string"
response = "scpi_string"
template = "*IDN?"

[commands.read_error]
description = "Read next error from error queue"
response = "scpi_string"
template = "SYSTem:ERRor:NEXT?"

[commands.read_power]
description = "Read optical power (W)"
response = "scpi_float"
template = "MEASure:SCALar:POWer?"

[commands.set_autorange_off]
description = "Disable auto-range"
expects_response = false
template = "SENSe:POWer:DC:RANGe:AUTO OFF"

[commands.set_autorange_on]
description = "Enable auto-range"
expects_response = false
template = "SENSe:POWer:DC:RANGe:AUTO ON"

[commands.set_wavelength]
description = "Set correction wavelength (nm)"
expects_response = false
template = "SENSe:CORRection:WAVelength {{ value }}"

[commands.set_wavelength.parameters]
value = "float"

[commands.zero_sensor]
description = "Initiate zero adjustment (block laser before calling)"
expects_response = false
template = "SENSe:CORRection:COLLect:ZERO:INITiate"

[connection]
terminator_tx = """

"""
timeout_ms = 5000
type = "usbtmc"

[device]
capabilities = [
    "Readable",
    "WavelengthTunable",
    "Commandable",
]
category = "power_meter"
description = "Thorlabs PM400 optical power meter with SCPI control"
manufacturer = "Thorlabs"
model = "PM400"
name = "Thorlabs PM400"
protocol = "scpi"

[responses.scpi_float]
transform = [
    "trim",
    "to_float",
]

[responses.scpi_int]
transform = [
    "trim",
    "to_int",
]

[responses.scpi_string]
transform = ["trim"]

[ui]
color = "#1E88E5"
icon = "sensor"
panel_kind = "power_meter"

[ui.control_panel]
layout = "vertical"
show_header = true

[[ui.control_panel.sections]]
label = "Optical Power"
precision = 6
refresh_ms = 500
type = "sensor"
unit = "W"

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
label = "Wavelength"
parameter = "wavelength"
read_command = "get_wavelength"
read_only = false
type = "parameter"
widget = "spinner"
write_command = "set_wavelength"

[[ui.control_panel.sections]]
command = "zero_sensor"
label = "Zero Sensor"
style = "warning"
type = "custom_action"

[ui.status_display]
show_connection = true
summary_format = "{{ power }} W"
summary_params = ["power"]
