# NOTE: Newport 1830-C uses a simple ASCII protocol (not SCPI).
# This v2 manifest is a best-effort mapping for the current declarative driver.

schema_version = 2
name = "Newport 1830-C"
version = "1.0.0"

[connection]
type = "serial"
baud_rate = 9600
terminator = "\n"
timeout_ms = 500

[commands.read_power]
template = "D?"
query = true
response_type = "float"

[commands.get_wavelength]
template = "W?"
query = true
response_type = "integer"

[commands.set_wavelength]
template = "W{{ value | int }}"
query = false
response_type = "none"

[capabilities.readable]
read = "read_power"

[capabilities.wavelength_tunable]
set_wavelength = "set_wavelength"
get_wavelength = "get_wavelength"

[[instances]]
id = "newport_1830c"
name = "Newport 1830-C"
port = "/dev/ttyUSB0"
address = "0"
disable = true
