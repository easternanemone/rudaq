schema_version = 3

[capabilities.movable.move_abs]
command = "move_absolute"
from_param = "position"
input_param = "position"

[capabilities.movable.position]
command = "get_position"
output_field = "value"

[capabilities.movable.stop]
command = "stop"

[capabilities.movable.wait_settled]
poll_command = "get_motion_done"
poll_interval_ms = 100
success_condition = "value == 0"
timeout_ms = 60000

[commands.get_acceleration]
description = "Query acceleration"
response = "acceleration"
template = "{{ address }}AC?"

[commands.get_motion_done]
description = "Query motion status (0=stationary, 1=moving)"
response = "motion_status"
template = "{{ address }}MD?"

[commands.get_position]
description = "Query current position"
response = "position"
template = "{{ address }}TP?"

[commands.get_velocity]
description = "Query velocity"
response = "velocity"
template = "{{ address }}VA?"

[commands.home]
description = "Home axis (find mechanical zero)"
expects_response = false
template = "{{ address }}OR"

[commands.move_absolute]
description = "Move to absolute position (mm)"
expects_response = false
template = "{{ address }}PA{{ position }}"

[commands.move_absolute.parameters]
position = "float"

[commands.move_relative]
description = "Move relative distance (mm)"
expects_response = false
template = "{{ address }}PR{{ distance }}"

[commands.move_relative.parameters]
distance = "float"

[commands.set_acceleration]
description = "Set acceleration (mm/s^2)"
expects_response = false
template = "{{ address }}AC{{ acceleration }}"

[commands.set_acceleration.parameters]
acceleration = "float"

[commands.set_velocity]
description = "Set velocity (mm/s)"
expects_response = false
template = "{{ address }}VA{{ velocity }}"

[commands.set_velocity.parameters]
velocity = "float"

[commands.stop]
description = "Stop motion immediately"
expects_response = false
template = "{{ address }}ST"

[connection]
baud_rate = 19200
data_bits = 8
flow_control = "hardware"
parity = "none"
stop_bits = 1
terminator_rx = """
\r
"""
terminator_tx = "\r"
timeout_ms = 5000
type = "serial"

[device]
capabilities = [
    "Movable",
    "Parameterized",
]
category = "stage"
description = "Multi-axis motion controller (up to 3 axes)"
manufacturer = "Newport"
model = "ESP300"
name = "Newport ESP300"
protocol = "esp300"

[error_codes.0]
description = "No error"
name = "OK"
recoverable = true

[error_codes.1]
description = "Axis not found"
name = "AxisNotFound"
recoverable = false

[error_codes.2]
description = "Command not allowed in current state"
name = "CommandNotAllowed"
recoverable = true

[parameters.acceleration_mm_s2]
default = 100.0
description = "Motion acceleration"
type = "float"
unit = "mm/s^2"

[parameters.axis]
default = 1
description = "Axis number (1-3)"
range = [
    1,
    3,
]
type = "int"

[parameters.position_mm]
default = 0.0
description = "Current position"
type = "float"
unit = "mm"

[parameters.velocity_mm_s]
default = 10.0
description = "Motion velocity"
type = "float"
unit = "mm/s"

[responses.acceleration]
transform = [
    "trim",
    "to_float",
]

[responses.motion_status]
transform = [
    "trim",
    "to_int",
]

[responses.position]
transform = [
    "trim",
    "to_float",
]

[responses.velocity]
transform = [
    "trim",
    "to_float",
]

[ui]
panel_kind = "stage"
