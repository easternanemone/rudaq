# config/devices/ipg_laser.toml
# IPG Fiber Laser - Protocol Definition
#
# Converted from v2 SCPI format to v3 schema.

schema_version = 3

[device]
name = "IPG Fiber Laser"
description = "IPG fiber laser with TCP control"
capabilities = ["Readable"]

[connection]
type = "tcp"
host = "10.0.0.15"
port = 10001
timeout_ms = 1000

# ==============================================================================
# Command Definitions
# ==============================================================================

[commands.emission_on]
template = "EMON"
description = "Enable laser emission"
expects_response = false

[commands.emission_off]
template = "EMOFF"
description = "Disable laser emission"
expects_response = false

[commands.read_emission]
template = "REM"
description = "Read emission status"
response_type = "string"

[commands.set_current]
template = "SCS {{ value }}"
description = "Set laser current"
parameters = { value = "float" }
expects_response = false

[commands.read_current]
template = "RCS"
description = "Read laser current"
response_type = "float"

[commands.read_power]
template = "ROP"
description = "Read output power"
response_type = "float"

[commands.read_status]
template = "STA"
description = "Read laser status"
response_type = "integer"

[commands.read_error]
template = "REF"
description = "Read error status"
response_type = "string"

[commands.set_rep_rate]
template = "SRR {{ value }}"
description = "Set repetition rate"
parameters = { value = "float" }
expects_response = false

[commands.read_rep_rate]
template = "RRR"
description = "Read repetition rate"
response_type = "float"

[commands.reset_errors]
template = "RERR"
description = "Reset error flags"
expects_response = false

# ==============================================================================
# Capability Mapping
# ==============================================================================

[capabilities.readable]
read = { command = "read_power" }

# ==============================================================================
# UI Configuration
# ==============================================================================

[ui]
icon = "laser"
color = "#FF6B00"

[ui.control_panel]
layout = "vertical"
show_header = true

[[ui.control_panel.sections]]
type = "sensor"
label = "Output Power"
precision = 2
unit = "W"
refresh_ms = 500

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
type = "custom_action"
label = "Emission ON"
command = "emission_on"
style = "success"

[[ui.control_panel.sections]]
type = "custom_action"
label = "Emission OFF"
command = "emission_off"
style = "danger"

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
type = "parameter"
label = "Repetition Rate"
parameter = "rep_rate"
widget = "spinner"
read_only = false

[[ui.control_panel.sections]]
type = "status_display"
label = "Laser Status"
parameters = ["status", "error"]
compact = true

[ui.status_display]
summary_params = ["power"]
summary_format = "{{ power }} W"
show_connection = true
