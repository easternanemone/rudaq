schema_version = 3

[capabilities.emission_control.disable]
command = "emission_off"

[capabilities.emission_control.enable]
command = "emission_on"

[capabilities.emission_control.is_enabled]
command = "read_emission"

[capabilities.readable.read]
command = "read_power"
output_field = "value"

[commands.emission_off]
description = "Disable laser emission"
expects_response = false
template = "EMOFF"

[commands.emission_on]
description = "Enable laser emission"
expects_response = false
template = "EMON"

[commands.read_current]
description = "Read laser current setpoint (percent)"
response = "ipg_float"
template = "RCS"

[commands.read_emission]
description = "Read emission status (On/Off)"
response = "ipg_string"
template = "REM"

[commands.read_error]
description = "Read error flags (hex bitmask)"
response = "ipg_string"
template = "REF"

[commands.read_power]
description = "Read output power (W). Returns 'Off' when emission is disabled."
response = "ipg_power"
template = "ROP"

[commands.read_rep_rate]
description = "Read repetition rate (kHz)"
response = "ipg_float"
template = "RRR"

[commands.read_status]
description = "Read laser status word (bitmask)"
response = "ipg_integer"
template = "STA"

[commands.reset_errors]
description = "Reset error flags"
expects_response = false
template = "RERR"

[commands.set_current]
description = "Set laser current (percent)"
expects_response = false
template = "SCS {{ value }}"

[commands.set_current.parameters]
value = "float"

[commands.set_rep_rate]
description = "Set repetition rate (kHz)"
expects_response = false
template = "SRR {{ value }}"

[commands.set_rep_rate.parameters]
value = "float"

[connection]
host = "10.0.0.15"
port = 10001
terminator = """
\r
"""
timeout_ms = 1000
type = "tcp"

[device]
capabilities = [
    "Readable",
    "EmissionControl",
    "Commandable",
]
category = "source"
description = "IPG ytterbium fiber laser with TCP control"
manufacturer = "IPG Photonics"
model = "YLPP-200-1-50-R"
name = "IPG YLPP-200-1-50-R"
protocol = "ipg_tcp"

[responses.ipg_float]
transform = [
    "format('{cmd}: {value}', 'value')",
    "trim",
    "to_float",
]

[responses.ipg_integer]
transform = [
    "format('{cmd}: {value}', 'value')",
    "trim",
    "to_int",
]

[responses.ipg_power]
transform = [
    "format('{cmd}: {value}', 'value')",
    "trim",
    "map('Off', '0.0')",
    "to_float",
]

[responses.ipg_string]
transform = [
    "format('{cmd}: {value}', 'value')",
    "trim",
]

[ui]
color = "#FF6B00"
icon = "laser"
panel_kind = "maitai"

[ui.control_panel]
layout = "vertical"
show_header = true

[[ui.control_panel.sections]]
label = "Output Power"
precision = 2
refresh_ms = 500
type = "sensor"
unit = "W"

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
command = "emission_on"
label = "Emission ON"
style = "success"
type = "custom_action"

[[ui.control_panel.sections]]
command = "emission_off"
label = "Emission OFF"
style = "danger"
type = "custom_action"

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
label = "Repetition Rate"
parameter = "rep_rate"
read_command = "read_rep_rate"
read_only = false
type = "parameter"
widget = "spinner"
write_command = "set_rep_rate"

[[ui.control_panel.sections]]
compact = true
label = "Laser Status"
parameters = [
    "status",
    "error",
]
type = "status_display"

[ui.status_display]
show_connection = true
summary_format = "{{ power }} W"
summary_params = ["power"]
