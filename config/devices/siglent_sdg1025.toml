schema_version = 3

[capabilities.settable.set]
command = "set_ch1_offset"
input_param = "value"

[commands.get_ch1_config]
description = "Query channel 1 basic waveform parameters"
response = "bswv_response"
template = "C1:BSWV?"

[commands.get_ch2_config]
description = "Query channel 2 basic waveform parameters"
response = "bswv_response"
template = "C2:BSWV?"

[commands.identify]
description = "Query device identity"
response = "identity"
template = "*IDN?"

[commands.set_ch1_amplitude]
description = "Set channel 1 amplitude"
expects_response = false
template = "C1:BSWV AMP,{{ value }}"

[commands.set_ch1_amplitude.parameters]
value = "float"

[commands.set_ch1_frequency]
description = "Set channel 1 frequency"
expects_response = false
template = "C1:BSWV FRQ,{{ value }}"

[commands.set_ch1_frequency.parameters]
value = "float"

[commands.set_ch1_full]
description = "Set channel 1 waveform, frequency, amplitude, and offset in one command"
expects_response = false
template = "C1:BSWV WVTP,{{ waveform }},FRQ,{{ frequency }},AMP,{{ amplitude }},OFST,{{ offset }}"

[commands.set_ch1_full.parameters]
amplitude = "float"
frequency = "float"
offset = "float"
waveform = "string"

[commands.set_ch1_offset]
description = "Set channel 1 DC offset"
expects_response = false
template = "C1:BSWV OFST,{{ value }}"

[commands.set_ch1_offset.parameters]
value = "float"

[commands.set_ch1_output]
description = "Set channel 1 output (ON/OFF)"
expects_response = false
template = "C1:OUTP {{ value }}"

[commands.set_ch1_output.parameters]
value = "string"

[commands.set_ch1_waveform]
description = "Set channel 1 waveform type"
expects_response = false
template = "C1:BSWV WVTP,{{ value }}"

[commands.set_ch1_waveform.parameters]
value = "string"

[commands.set_ch2_amplitude]
description = "Set channel 2 amplitude"
expects_response = false
template = "C2:BSWV AMP,{{ value }}"

[commands.set_ch2_amplitude.parameters]
value = "float"

[commands.set_ch2_frequency]
description = "Set channel 2 frequency"
expects_response = false
template = "C2:BSWV FRQ,{{ value }}"

[commands.set_ch2_frequency.parameters]
value = "float"

[commands.set_ch2_full]
description = "Set channel 2 waveform, frequency, amplitude, and offset in one command"
expects_response = false
template = "C2:BSWV WVTP,{{ waveform }},FRQ,{{ frequency }},AMP,{{ amplitude }},OFST,{{ offset }}"

[commands.set_ch2_full.parameters]
amplitude = "float"
frequency = "float"
offset = "float"
waveform = "string"

[commands.set_ch2_offset]
description = "Set channel 2 DC offset"
expects_response = false
template = "C2:BSWV OFST,{{ value }}"

[commands.set_ch2_offset.parameters]
value = "float"

[commands.set_ch2_output]
description = "Set channel 2 output (ON/OFF)"
expects_response = false
template = "C2:OUTP {{ value }}"

[commands.set_ch2_output.parameters]
value = "string"

[commands.set_ch2_waveform]
description = "Set channel 2 waveform type"
expects_response = false
template = "C2:BSWV WVTP,{{ value }}"

[commands.set_ch2_waveform.parameters]
value = "string"

[connection]
baud_rate = 115200
terminator_rx = """

"""
terminator_tx = """

"""
timeout_ms = 2000
type = "serial"

[device]
capabilities = [
    "Settable",
    "Parameterized",
    "Commandable",
]
category = "modulator"
description = "25 MHz arbitrary waveform generator for galvo mirror drive"
manufacturer = "Siglent"
model = "SDG1025"
name = "Siglent SDG1025"
protocol = "siglent_sdg"

[emulator]
identity = "Siglent Technologies,SDG1025,SDG00001234567,1.01.01.33R1"
mode = "echo"

[[emulator.responses]]
pattern = '\*IDN\?'
response = "{{ identity }}"

[[emulator.responses]]
pattern = 'C1:BSWV\?'
response = "C1:BSWV WVTP,{{ ch1_waveform }},FRQ,{{ ch1_frequency }}HZ,AMP,{{ ch1_amplitude }}V,OFST,{{ ch1_offset }}V"

[[emulator.responses]]
pattern = 'C2:BSWV\?'
response = "C2:BSWV WVTP,{{ ch2_waveform }},FRQ,{{ ch2_frequency }}HZ,AMP,{{ ch2_amplitude }}V,OFST,{{ ch2_offset }}V"

[[emulator.responses]]
pattern = 'C1:BSWV OFST,([\-\.0-9eE]+)'

[emulator.responses.set_state]
ch1_offset = "$1"

[[emulator.responses]]
pattern = 'C2:BSWV OFST,([\-\.0-9eE]+)'

[emulator.responses.set_state]
ch2_offset = "$1"

[[emulator.responses]]
pattern = "C1:OUTP (ON|OFF)"

[emulator.responses.set_state]
ch1_output = "$1"

[[emulator.responses]]
pattern = "C2:OUTP (ON|OFF)"

[emulator.responses.set_state]
ch2_output = "$1"

[emulator.state]
ch1_amplitude = "2.0"
ch1_frequency = "100.0"
ch1_offset = "0.0"
ch1_output = "OFF"
ch1_waveform = "SINE"
ch2_amplitude = "2.0"
ch2_frequency = "100.0"
ch2_offset = "0.0"
ch2_output = "OFF"
ch2_waveform = "SINE"

[[init_sequence]]
command = "identify"
description = "Query device identity"
expect = "Siglent"
required = true

[[init_sequence]]
command = "get_ch1_config"
delay_ms = 100
description = "Read channel 1 waveform configuration"
required = false

[[init_sequence]]
command = "get_ch2_config"
delay_ms = 100
description = "Read channel 2 waveform configuration"
required = false

[parameters.ch1_amplitude_v]
default = 2.0
description = "Channel 1 amplitude (galvo X scan range)"
range = [
    0.002,
    20.0,
]
type = "float"
unit = "Vpp"
write_command = "set_ch1_amplitude"

[parameters.ch1_frequency_hz]
default = 100.0
description = "Channel 1 frequency (galvo X scan rate)"
range = [
    0.000001,
    25000000.0,
]
type = "float"
unit = "Hz"
write_command = "set_ch1_frequency"

[parameters.ch1_offset_v]
default = 0.0
description = "Channel 1 DC offset (galvo X scan offset)"
range = [
    -10.0,
    10.0,
]
read_command = "get_ch1_config"
type = "float"
unit = "V"
write_command = "set_ch1_offset"

[parameters.ch1_output]
default = false
description = "Channel 1 output enable"
type = "bool"
write_command = "set_ch1_output"

[parameters.ch1_waveform]
choices = [
    "SINE",
    "SQUARE",
    "RAMP",
    "PULSE",
    "NOISE",
    "ARB",
    "DC",
]
default = "SINE"
description = "Channel 1 waveform type"
type = "string"
write_command = "set_ch1_waveform"

[parameters.ch2_amplitude_v]
default = 2.0
description = "Channel 2 amplitude (galvo Y scan range)"
range = [
    0.002,
    20.0,
]
type = "float"
unit = "Vpp"
write_command = "set_ch2_amplitude"

[parameters.ch2_frequency_hz]
default = 100.0
description = "Channel 2 frequency (galvo Y scan rate)"
range = [
    0.000001,
    25000000.0,
]
type = "float"
unit = "Hz"
write_command = "set_ch2_frequency"

[parameters.ch2_offset_v]
default = 0.0
description = "Channel 2 DC offset (galvo Y scan offset)"
range = [
    -10.0,
    10.0,
]
read_command = "get_ch2_config"
type = "float"
unit = "V"
write_command = "set_ch2_offset"

[parameters.ch2_output]
default = false
description = "Channel 2 output enable"
type = "bool"
write_command = "set_ch2_output"

[parameters.ch2_waveform]
choices = [
    "SINE",
    "SQUARE",
    "RAMP",
    "PULSE",
    "NOISE",
    "ARB",
    "DC",
]
default = "SINE"
description = "Channel 2 waveform type"
type = "string"
write_command = "set_ch2_waveform"

[responses.bswv_response.advanced]
regex = 'OFST,(?P<offset>[\-\.0-9eE]+)V'

[responses.identity]
transform = ["trim"]

[ui]
color = "#4CAF50"
icon = "waveform"
panel_kind = "generic"

[ui.control_panel]
layout = "vertical"

[[ui.control_panel.sections]]
label = "Channel 1 (Galvo X)"
type = "separator"

[[ui.control_panel.sections]]
label = "X Offset"
parameter = "ch1_offset_v"
precision = 3
type = "parameter"
widget = "spinner"

[[ui.control_panel.sections]]
label = "X Amplitude"
parameter = "ch1_amplitude_v"
precision = 3
type = "parameter"
widget = "spinner"

[[ui.control_panel.sections]]
label = "X Frequency"
parameter = "ch1_frequency_hz"
precision = 1
type = "parameter"
widget = "spinner"

[[ui.control_panel.sections]]
label = "X Waveform"
parameter = "ch1_waveform"
type = "parameter"
widget = "dropdown"

[[ui.control_panel.sections]]
label = "Channel 2 (Galvo Y)"
type = "separator"

[[ui.control_panel.sections]]
label = "Y Offset"
parameter = "ch2_offset_v"
precision = 3
type = "parameter"
widget = "spinner"

[[ui.control_panel.sections]]
label = "Y Amplitude"
parameter = "ch2_amplitude_v"
precision = 3
type = "parameter"
widget = "spinner"

[[ui.control_panel.sections]]
label = "Y Frequency"
parameter = "ch2_frequency_hz"
precision = 1
type = "parameter"
widget = "spinner"

[[ui.control_panel.sections]]
label = "Y Waveform"
parameter = "ch2_waveform"
type = "parameter"
widget = "dropdown"
