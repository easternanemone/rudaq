schema_version = 2
name = "IPG Fiber Laser"
version = "1.0.0"

[connection]
type = "tcp"
host = "10.0.0.15"
port = 10001
terminator = "\r"
timeout_ms = 1000

# === Commands ===

[commands.emission_on]
template = "EMON"
query = false

[commands.emission_off]
template = "EMOFF"
query = false

[commands.read_emission]
template = "REM"
query = true
response_type = "string"

[commands.set_current]
template = "SCS {{ value }}"
query = false

[commands.read_current]
template = "RCS"
query = true
response_type = "float"

[commands.read_power]
template = "ROP"
query = true
response_type = "float"

[commands.read_status]
template = "STA"
query = true
response_type = "integer"

[commands.read_error]
template = "REF"
query = true
response_type = "string"

[commands.set_rep_rate]
template = "SRR {{ value }}"
query = false

[commands.read_rep_rate]
template = "RRR"
query = true
response_type = "float"

[commands.reset_errors]
template = "RERR"
query = false

# === Capabilities ===

[capabilities.readable]
read = "read_power"

# === UI Configuration ===

[ui]
icon = "laser"
color = "#FF6B00"

[ui.control_panel]
layout = "vertical"
show_header = true

[[ui.control_panel.sections]]
type = "sensor"
label = "Output Power"
precision = 2
unit = "W"
refresh_ms = 500

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
type = "custom_action"
label = "Emission ON"
command = "emission_on"
style = "success"

[[ui.control_panel.sections]]
type = "custom_action"
label = "Emission OFF"
command = "emission_off"
style = "danger"

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
type = "parameter"
label = "Repetition Rate"
parameter = "rep_rate"
widget = "spinner"
read_only = false

[[ui.control_panel.sections]]
type = "status_display"
label = "Laser Status"
parameters = ["status", "error"]
compact = true

[ui.status_display]
summary_params = ["power"]
summary_format = "${power} W"
show_connection = true
