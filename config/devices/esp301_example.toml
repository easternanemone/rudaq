# Example: Newport ESP301 using inheritance
# This inherits common Newport motion controller settings and only specifies differences
#
# Note: The `extends` field indicates this config would be merged with a base
# config at load time. The connection section below provides defaults that
# would normally come from the base config.

schema_version = 3

extends = "bases/newport_motion_base.toml"

[device]
name = "Newport ESP301"
model = "ESP301"
description = "Newport ESP301 3-axis motion controller"
capabilities = ["Movable"]

# Default connection (would be inherited from base in practice)
[connection]
type = "serial"
baud_rate = 19200
timeout_ms = 5000

# Override home command (ESP301 uses OR1 instead of base OR0)
[commands.home]
template = "OR{{ axis }}"
description = "Home the axis"
expects_response = false

[capabilities.movable]
# NOTE: Other movable methods inherited from base config

[ui]
panel_kind = "stage"
