schema_version = 3

[capabilities.readable.read]
command = "read_power"
output_field = "value"

[commands.disable_pid]
description = "Disable PID feedback loop"
expects_response = false
template = "PID:EN OFF"

[commands.enable_pid]
description = "Enable PID feedback loop"
expects_response = false
template = "PID:EN ON"

[commands.identity]
description = "Query device identity"
response = "pid_string"
template = "*IDN?"

[commands.read_enabled]
description = "Read PID loop enabled state"
response = "pid_bool"
template = "PID:EN?"

[commands.read_error]
description = "Read error signal (setpoint - measured)"
response = "pid_float"
template = "PID:ERR?"

[commands.read_kd]
description = "Read derivative gain"
response = "pid_float"
template = "PID:KD?"

[commands.read_ki]
description = "Read integral gain"
response = "pid_float"
template = "PID:KI?"

[commands.read_kp]
description = "Read proportional gain"
response = "pid_float"
template = "PID:KP?"

[commands.read_output_max]
description = "Read maximum output limit"
response = "pid_float"
template = "PID:OMAX?"

[commands.read_output_min]
description = "Read minimum output limit"
response = "pid_float"
template = "PID:OMIN?"

[commands.read_pid_output]
description = "Read PID controller output (clamped to limits)"
response = "pid_float"
template = "PID:OUT?"

[commands.read_power]
description = "Read current measured power (mW)"
response = "pid_float"
template = "PID:INP?"

[commands.read_setpoint]
description = "Read target power setpoint (mW)"
response = "pid_float"
template = "PID:SETP?"

[commands.set_kd]
description = "Set derivative gain"
expects_response = false
template = "PID:KD {{ value }}"

[commands.set_kd.parameters]
value = "float"

[commands.set_ki]
description = "Set integral gain"
expects_response = false
template = "PID:KI {{ value }}"

[commands.set_ki.parameters]
value = "float"

[commands.set_kp]
description = "Set proportional gain"
expects_response = false
template = "PID:KP {{ value }}"

[commands.set_kp.parameters]
value = "float"

[commands.set_output_max]
description = "Set maximum output limit"
expects_response = false
template = "PID:OMAX {{ value }}"

[commands.set_output_max.parameters]
value = "float"

[commands.set_output_min]
description = "Set minimum output limit"
expects_response = false
template = "PID:OMIN {{ value }}"

[commands.set_output_min.parameters]
value = "float"

[commands.set_setpoint]
description = "Set target power setpoint (mW)"
expects_response = false
template = "PID:SETP {{ value }}"

[commands.set_setpoint.parameters]
value = "float"

[connection]
host = "192.168.1.100"
port = 5000
terminator = """
\r
"""
timeout_ms = 2000
type = "tcp"

[device]
capabilities = [
    "Readable",
    "Commandable",
]
category = "controller"
description = "Red Pitaya STEMlab FPGA-based PID controller for laser power stabilization"
manufacturer = "Red Pitaya"
model = "STEMlab PID"
name = "Red Pitaya PID"
protocol = "scpi_tcp"

[responses.pid_bool]
transform = [
    "trim",
    "map('0', 'false')",
    "map('1', 'true')",
]

[responses.pid_float]
transform = [
    "trim",
    "to_float",
]

[responses.pid_string]
transform = ["trim"]

[ui]
color = "#4CAF50"
icon = "tune"
panel_kind = "generic"

[ui.control_panel]
layout = "vertical"
show_header = true

[[ui.control_panel.sections]]
label = "Power"
precision = 3
refresh_ms = 500
type = "sensor"
unit = "mW"

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
command = "enable_pid"
label = "Enable PID"
style = "success"
type = "custom_action"

[[ui.control_panel.sections]]
command = "disable_pid"
label = "Disable PID"
style = "danger"
type = "custom_action"

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
label = "Setpoint"
parameter = "setpoint"
read_command = "read_setpoint"
read_only = false
type = "parameter"
widget = "spinner"
write_command = "set_setpoint"

[[ui.control_panel.sections]]
label = "Kp (Proportional)"
parameter = "kp"
read_command = "read_kp"
read_only = false
type = "parameter"
widget = "spinner"
write_command = "set_kp"

[[ui.control_panel.sections]]
label = "Ki (Integral)"
parameter = "ki"
read_command = "read_ki"
read_only = false
type = "parameter"
widget = "spinner"
write_command = "set_ki"

[[ui.control_panel.sections]]
label = "Kd (Derivative)"
parameter = "kd"
read_command = "read_kd"
read_only = false
type = "parameter"
widget = "spinner"
write_command = "set_kd"

[[ui.control_panel.sections]]
label = "Output Min"
parameter = "output_min"
read_command = "read_output_min"
read_only = false
type = "parameter"
widget = "spinner"
write_command = "set_output_min"

[[ui.control_panel.sections]]
label = "Output Max"
parameter = "output_max"
read_command = "read_output_max"
read_only = false
type = "parameter"
widget = "spinner"
write_command = "set_output_max"

[[ui.control_panel.sections]]
type = "separator"
visible = true

[[ui.control_panel.sections]]
compact = true
label = "PID Status"
parameters = [
    "error",
    "pid_output",
]
type = "status_display"

[ui.status_display]
show_connection = true
summary_format = "{{ power }} mW"
summary_params = ["power"]
