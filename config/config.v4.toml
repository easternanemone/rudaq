# rust-daq configuration (v4)
# gRPC server security defaults: loopback bind, restricted CORS, optional auth/TLS.

[grpc]
# Bind address for the gRPC server (port is provided by CLI/runtime).
bind_address = "0.0.0.0"

# Optional TLS configuration (PEM-encoded).
# tls_cert_path = "config/tls/server.crt"
# tls_key_path = "config/tls/server.key"

# Authentication settings (API key or JWT HMAC secret).
auth_enabled = false
# auth_token = "change-me"

# Allowed origins for gRPC-web (CORS).
# WARNING: ["*"] permits any website visited in a user's browser to reach this
# daemon and issue hardware commands. Only safe on isolated, trusted lab networks.
# For production or any network with untrusted clients, restrict to specific origins:
#   allowed_origins = ["http://localhost:8080", "https://daq.example.com"]
allowed_origins = ["*"]

[storage]
# Path to the memory-mapped ring buffer file.
# On Linux, use /dev/shm for performance. On macOS, use /tmp.
# Defaults:
# Linux: /dev/shm/rust_daq_scan_data.buf
# macOS: /tmp/rust_daq_scan_data.buf
# ring_buffer_path = "/tmp/rust_daq_scan_data.buf"

# Size of the ring buffer in MB.
# ring_buffer_size_mb = 100

# Path to the HDF5 output file for scan data persistence.
# Defaults: /tmp/rust_daq_scan_data.h5
# hdf5_path = "/tmp/rust_daq_scan_data.h5"

# Directory where persistent recordings (HDF5) are saved.
# Also overridable via --data-path CLI flag or DAQ_DATA_PATH env var.
# output_directory = "./data"

# Tap channel size (frames buffered per tap consumer).
# tap_channel_size = 32

# [alerting]
# Webhook alerting for device faults and plan aborts.
# Supports Slack-style incoming webhooks (also compatible with Discord).
#
# webhook_url = "https://hooks.slack.com/services/T.../B.../..."
# rate_limit_secs = 60
# alert_on_fault = true
# alert_on_restart_limit = true
# alert_on_plan_abort = true
# max_restart_attempts = 5
