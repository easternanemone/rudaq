# rust-daq configuration (v4)
# gRPC server security defaults: loopback bind, restricted CORS, optional auth/TLS.

[grpc]
# Bind address for the gRPC server (port is provided by CLI/runtime).
bind_address = "0.0.0.0"

# Optional TLS configuration (PEM-encoded).
# tls_cert_path = "config/tls/server.crt"
# tls_key_path = "config/tls/server.key"

# Authentication settings (API key or JWT HMAC secret).
auth_enabled = false
# auth_token = "change-me"

# Allowed origins for gRPC-web (CORS). Keep this list tight.
allowed_origins = ["http://localhost:3000", "http://127.0.0.1:3000"]

[storage]
# Path to the memory-mapped ring buffer file.
# On Linux, use /dev/shm for performance. On macOS, use /tmp.
# Defaults:
# Linux: /dev/shm/rust_daq_scan_data.buf
# macOS: /tmp/rust_daq_scan_data.buf
# ring_buffer_path = "/tmp/rust_daq_scan_data.buf"

# Size of the ring buffer in MB.
# ring_buffer_size_mb = 100

# Path to the HDF5 output file for scan data persistence.
# Defaults: /tmp/rust_daq_scan_data.h5
# hdf5_path = "/tmp/rust_daq_scan_data.h5"

# Directory where persistent recordings (HDF5) are saved.
# output_directory = "./data"
