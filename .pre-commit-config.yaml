# Pre-commit hooks for rust-daq
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#
# Run manually on all files:
#   pre-commit run --all-files
#
# Skip hooks (emergency use only):
#   git commit --no-verify

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$|\.txt$'
      - id: end-of-file-fixer
        exclude: '\.md$|\.txt$'
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: detect-private-key

  # Rust formatting with cargo fmt
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
        description: "Format Rust code with cargo fmt"

  # Rust linting with clippy
  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cargo clippy --workspace --all-targets --all-features --exclude ui -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false
        description: "Lint Rust code with clippy (excludes ui)"

  # Deny unwrap in library code (enforce expect() with justification)
  - repo: local
    hooks:
      - id: cargo-clippy-unwrap
        name: cargo clippy (deny unwrap)
        entry: bash -c 'cargo clippy --workspace --lib --all-features --exclude ui -- -D clippy::unwrap_used'
        language: system
        types: [rust]
        pass_filenames: false
        description: "Deny .unwrap() in library code"

      # ast-grep structural lint (blocks on error-severity rules only)
      # File exclusions are handled by .ignore (gitignore syntax)
      - id: ast-grep
        name: ast-grep lint
        entry: bash scripts/run-ast-grep.sh scan
        language: system
        types: [rust]
        pass_filenames: false
        description: "Structural code analysis (panic, todo, blocking sleep, unsafe audit)"

  # Rust tests (fast unit tests only, not integration tests)
  - repo: local
    hooks:
      - id: cargo-test
        name: cargo test (unit tests)
        entry: bash -c 'cargo test --lib --bins --workspace --exclude ui'
        language: system
        types: [rust]
        pass_filenames: false
        description: "Run fast unit tests"
        # Only run on Rust file changes to avoid slowdowns
        stages: [commit]

  # Check for unsafe code (warning only)
  - repo: local
    hooks:
      - id: check-unsafe
        name: check for new unsafe blocks
        entry: bash -c 'git diff --cached --name-only | grep "\.rs$" | xargs -r rg "unsafe" --count || true'
        language: system
        types: [rust]
        pass_filenames: false
        description: "Warn about unsafe blocks in changed files"
        verbose: true

  # Cargo.toml dependency check
  - repo: local
    hooks:
      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace --all-targets --features full
        language: system
        types: [rust]
        pass_filenames: false
        description: "Verify code compiles"
        stages: [push]  # Only on push to save time on local commits

      - id: target-size-check
        name: target/ size check
        entry: bash -c 'if [ -d target ]; then size_kb=$(du -sk target | awk "{print \$1}"); threshold_kb=$((20 * 1024 * 1024)); if [ "$size_kb" -gt "$threshold_kb" ]; then size_human=$(du -sh target | awk "{print \$1}"); echo "WARNING: target/ is $size_human (>20GiB). Run: scripts/target-maintenance.sh"; fi; fi'
        language: system
        always_run: true
        pass_filenames: false
        description: "Warn when target/ directory exceeds 20GiB"
        stages: [push]
        verbose: true

  # Python formatting (for Python bindings and tools)
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3
        files: '^crates/rust-daq/python/.*\.py$'

  # TOML formatting
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.12.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix]
        exclude: 'Cargo\.lock$'

# Configuration
default_language_version:
  python: python3

# Run hooks in order
default_stages: [commit]

# Don't skip any hooks by default
fail_fast: false

# CI mode (for GitHub Actions)
ci:
  skip: [cargo-clippy, cargo-clippy-unwrap, cargo-test, cargo-check]  # These run separately in CI
